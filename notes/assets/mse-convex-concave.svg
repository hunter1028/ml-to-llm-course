<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">凸函数与凹函数的二阶导数和割线关系</title>
  <desc id="desc">左侧凸函数像碗，二阶导数大于零，斜率递增且曲线位于割线下方；右侧凹函数像山，二阶导数小于零，斜率递减且曲线位于割线上方。</desc>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="60" y="64" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#0f172a">二阶导数决定曲线向哪个方向弯</text>
  <text x="60" y="100" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569">不要只看函数值上升还是下降，要看斜率本身是在增大还是减小</text>

  <rect x="55" y="132" width="530" height="425" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <text x="90" y="177" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">凸函数：碗形 ∪</text>
  <text x="90" y="210" font-family="Arial, sans-serif" font-size="18" fill="#2563eb">f''(x) &gt; 0：斜率递增</text>
  <line x1="115" y1="485" x2="530" y2="485" stroke="#64748b" stroke-width="2"/>
  <line x1="115" y1="485" x2="115" y2="245" stroke="#64748b" stroke-width="2"/>
  <path d="M145 285 C225 505, 420 505, 500 285" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <line x1="175" y1="348" x2="470" y2="348" stroke="#f97316" stroke-width="4" stroke-dasharray="10 8"/>
  <circle cx="175" cy="348" r="8" fill="#f97316"/>
  <circle cx="470" cy="348" r="8" fill="#f97316"/>
  <text x="235" y="330" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#c2410c">两点之间的割线</text>
  <text x="194" y="527" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#1e3a8a">曲线位于割线下方，适合求最小值</text>

  <rect x="615" y="132" width="530" height="425" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="650" y="177" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#7e22ce">凹函数：山形 ∩</text>
  <text x="650" y="210" font-family="Arial, sans-serif" font-size="18" fill="#9333ea">f''(x) &lt; 0：斜率递减</text>
  <line x1="675" y1="485" x2="1090" y2="485" stroke="#64748b" stroke-width="2"/>
  <line x1="675" y1="485" x2="675" y2="245" stroke="#64748b" stroke-width="2"/>
  <path d="M705 455 C785 235, 980 235, 1060 455" fill="none" stroke="#9333ea" stroke-width="6" stroke-linecap="round"/>
  <line x1="735" y1="392" x2="1030" y2="392" stroke="#f97316" stroke-width="4" stroke-dasharray="10 8"/>
  <circle cx="735" cy="392" r="8" fill="#f97316"/>
  <circle cx="1030" cy="392" r="8" fill="#f97316"/>
  <text x="795" y="424" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#c2410c">两点之间的割线</text>
  <text x="753" y="527" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#6b21a8">曲线位于割线上方，适合求最大值</text>

  <text x="60" y="592" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#334155">镜像关系：f 是凸函数 ⇔ −f 是凹函数；直线同时是凸函数和凹函数。</text>
</svg>
