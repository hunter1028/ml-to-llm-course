<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a" />
    </marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .subtitle{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .text{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .math{font:17px "Times New Roman",serif;fill:#0f172a}
      .axis{stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .grid{stroke:#e2e8f0;stroke-width:1}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .loss{fill:none;stroke:#ef4444;stroke-width:2.2;opacity:.72}
      .diamond{fill:#dbeafe;stroke:#2563eb;stroke-width:3;opacity:.88}
      .lasso{fill:#16a34a;stroke:#ffffff;stroke-width:3}
      .ols{fill:#ef4444;stroke:#ffffff;stroke-width:3}
      .zero{stroke:#16a34a;stroke-width:5;stroke-linecap:round}
      .soft{fill:none;stroke:#16a34a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1280" height="680" fill="#ffffff"/>
  <text x="42" y="46" class="title">Lasso 为什么容易把权重变成 0</text>
  <text x="42" y="76" class="text">Lasso 的 L1 正则有两个等价视角：二维几何上是带尖角的菱形约束；一维求解上是软阈值，把弱信号直接截断为 0。</text>

  <!-- Left panel -->
  <rect x="40" y="110" width="570" height="495" rx="18" class="panel"/>
  <text x="70" y="146" class="subtitle">1. 二维几何：L1 约束的尖角落在坐标轴上</text>
  <text x="70" y="172" class="text">约束区域：|w₁| + |w₂| ≤ t。最先接触损失等高线的位置常在尖角，因此某个权重正好为 0。</text>

  <g transform="translate(315,382)">
    <!-- grid -->
    <line x1="-220" y1="0" x2="220" y2="0" class="grid"/>
    <line x1="0" y1="170" x2="0" y2="-220" class="grid"/>
    <line x1="-160" y1="170" x2="-160" y2="-220" class="grid"/>
    <line x1="160" y1="170" x2="160" y2="-220" class="grid"/>
    <line x1="-220" y1="-120" x2="220" y2="-120" class="grid"/>
    <line x1="-220" y1="120" x2="220" y2="120" class="grid"/>

    <!-- axes -->
    <line x1="-240" y1="0" x2="250" y2="0" class="axis"/>
    <line x1="0" y1="190" x2="0" y2="-245" class="axis"/>
    <text x="256" y="5" class="small">w₁</text>
    <text x="8" y="-250" class="small">w₂</text>
    <text x="8" y="18" class="small">0</text>

    <!-- L1 diamond -->
    <polygon points="0,-135 135,0 0,135 -135,0" class="diamond"/>
    <text x="-156" y="-150" class="small" fill="#1d4ed8">L1 可行区域</text>
    <text x="-156" y="-130" class="math" fill="#1d4ed8">|w₁|+|w₂|≤t</text>

    <!-- loss contours centered upper-right -->
    <ellipse cx="168" cy="-105" rx="46" ry="28" transform="rotate(-32 168 -105)" class="loss"/>
    <ellipse cx="168" cy="-105" rx="92" ry="56" transform="rotate(-32 168 -105)" class="loss"/>
    <ellipse cx="168" cy="-105" rx="138" ry="84" transform="rotate(-32 168 -105)" class="loss"/>
    <ellipse cx="168" cy="-105" rx="184" ry="112" transform="rotate(-32 168 -105)" class="loss"/>
    <circle cx="168" cy="-105" r="8" class="ols"/>
    <text x="180" y="-108" class="small" fill="#b91c1c">OLS</text>
    <text x="128" y="-206" class="small" fill="#b91c1c">数据损失等高线</text>

    <!-- lasso solution at right corner -->
    <circle cx="135" cy="0" r="9" class="lasso"/>
    <text x="148" y="5" class="small" fill="#166534">Lasso 解：w₂=0</text>
    <line x1="135" y1="0" x2="135" y2="-42" stroke="#16a34a" stroke-width="2" class="dash"/>
    <text x="52" y="44" class="small" fill="#166534">尖角在坐标轴上</text>

    <!-- arrow from OLS to Lasso -->
    <path d="M158,-94 C150,-72 142,-38 136,-9" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Right panel -->
  <rect x="670" y="110" width="570" height="495" rx="18" class="panel"/>
  <text x="700" y="146" class="subtitle">2. 一维机制：软阈值把弱信号截断为 0</text>
  <text x="700" y="172" class="text">zⱼ 表示该特征对残差的解释能力。只有 |zⱼ| 超过 λ，权重才会离开 0。</text>

  <g transform="translate(955,385)">
    <!-- grid -->
    <line x1="-230" y1="0" x2="240" y2="0" class="grid"/>
    <line x1="0" y1="175" x2="0" y2="-220" class="grid"/>
    <line x1="-120" y1="175" x2="-120" y2="-220" class="grid"/>
    <line x1="120" y1="175" x2="120" y2="-220" class="grid"/>
    <line x1="-230" y1="-120" x2="240" y2="-120" class="grid"/>
    <line x1="-230" y1="120" x2="240" y2="120" class="grid"/>

    <!-- axes -->
    <line x1="-250" y1="0" x2="260" y2="0" class="axis"/>
    <line x1="0" y1="190" x2="0" y2="-245" class="axis"/>
    <text x="266" y="5" class="small">zⱼ</text>
    <text x="8" y="-250" class="small">wⱼ*</text>
    <text x="8" y="18" class="small">0</text>

    <!-- lambda thresholds -->
    <line x1="-92" y1="150" x2="-92" y2="-210" stroke="#f59e0b" stroke-width="2" class="dash"/>
    <line x1="92" y1="150" x2="92" y2="-210" stroke="#f59e0b" stroke-width="2" class="dash"/>
    <text x="-113" y="24" class="small" fill="#b45309">-λ</text>
    <text x="84" y="24" class="small" fill="#b45309">λ</text>
    <rect x="-92" y="-20" width="184" height="40" fill="#fef3c7" opacity="0.65"/>
    <text x="-76" y="-35" class="small" fill="#b45309">弱信号区：权重为 0</text>

    <!-- soft threshold polyline: scale y down -->
    <path d="M-220,128 L-92,0 L92,0 L220,-128" class="soft"/>
    <text x="-236" y="146" class="small" fill="#166534">wⱼ*=zⱼ+λ</text>
    <text x="116" y="-138" class="small" fill="#166534">wⱼ*=zⱼ-λ</text>
    <line x1="-92" y1="0" x2="92" y2="0" class="zero"/>

    <!-- example points -->
    <circle cx="64" cy="0" r="7" fill="#f97316" stroke="#fff" stroke-width="2"/>
    <text x="22" y="62" class="small" fill="#c2410c">例：z=0.08&lt;λ</text>
    <text x="35" y="82" class="small" fill="#c2410c">w*=0</text>
    <circle cx="170" cy="-78" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
    <text x="130" y="-96" class="small" fill="#166534">z&gt;λ，保留但缩小</text>
  </g>

  <rect x="70" y="622" width="1140" height="38" rx="10" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="92" y="646" class="text">结论：Lasso 的 L1 尖角与软阈值机制会产生精确的 0；Ridge 的 L2 是圆滑惩罚，通常只会连续缩小权重。</text>
</svg>
