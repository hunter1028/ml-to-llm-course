<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">AI 技术演进地图</title><desc id="desc">从规则、传统机器学习、深度学习、Transformer、大模型到 AI 系统的演进。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">AI 技术体系：同一条问题求解主线</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">每次技术迭代都在改变表示、学习方式和可处理的问题范围</text><circle cx="115" cy="175" r="28" fill="#526176" stroke="#526176" stroke-width="2"/><text x="115" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><rect x="30" y="225" width="170" height="190" rx="16" fill="#FFFFFF" stroke="#526176" stroke-width="2"/><text x="115" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#526176" text-anchor="middle">规则系统</text><text x="115" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="middle">人工写逻辑</text><text x="115" y="355" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#526176" text-anchor="middle">边界清楚</text><path d="M 200 310 L 223 310" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="308" cy="175" r="28" fill="#059669" stroke="#059669" stroke-width="2"/><text x="308" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><rect x="223" y="225" width="170" height="190" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="2"/><text x="308" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#059669" text-anchor="middle">传统 ML</text><text x="308" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="middle">特征 + 标签</text><text x="308" y="355" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#526176" text-anchor="middle">结构化预测</text><path d="M 393 310 L 416 310" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="501" cy="175" r="28" fill="#0891B2" stroke="#0891B2" stroke-width="2"/><text x="501" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><rect x="416" y="225" width="170" height="190" rx="16" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/><text x="501" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#0891B2" text-anchor="middle">深度学习</text><text x="501" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="middle">自动表征</text><text x="501" y="355" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#526176" text-anchor="middle">图像与序列</text><path d="M 586 310 L 609 310" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="694" cy="175" r="28" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="694" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><rect x="609" y="225" width="170" height="190" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="694" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#2563EB" text-anchor="middle">Transformer</text><text x="694" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="middle">注意力建模</text><text x="694" y="355" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#526176" text-anchor="middle">长距离依赖</text><path d="M 779 310 L 802 310" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="887" cy="175" r="28" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="887" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><rect x="802" y="225" width="170" height="190" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="887" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#7C3AED" text-anchor="middle">大模型</text><text x="887" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="middle">预训练 + 对齐</text><text x="887" y="355" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#526176" text-anchor="middle">通用语言能力</text><path d="M 972 310 L 995 310" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="1080" cy="175" r="28" fill="#D97706" stroke="#D97706" stroke-width="2"/><text x="1080" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text><rect x="995" y="225" width="170" height="190" rx="16" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="1080" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#D97706" text-anchor="middle">AI 系统</text><text x="1080" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="middle">RAG/Agent/路由</text><text x="1080" y="355" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#526176" text-anchor="middle">业务闭环</text><text x="600" y="495" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#172033" text-anchor="middle">不变的底层能力：定义问题 → 准备数据 → 训练/调用 → 评测 → 部署 → 监控</text><text x="600" y="540" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#526176" text-anchor="middle">新技术不是自动淘汰旧技术，而是扩大工具箱</text></svg>