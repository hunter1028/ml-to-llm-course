<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">参数、数据与计算共同决定训练效果</title><desc id="desc">单独增加任一项都可能受到其他两项限制</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">参数、数据与计算共同决定训练效果</text><rect x="465" y="75" width="270" height="110" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="122" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700">参数量</text><text x="600" y="160" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="500">模型容量</text><rect x="150" y="400" width="270" height="110" rx="18" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="285" y="447" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700">有效数据</text><text x="285" y="485" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="500">覆盖与质量</text><rect x="780" y="400" width="270" height="110" rx="18" fill="#ffedd5" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="915" y="447" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700">训练计算</text><text x="915" y="485" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="500">优化充分程度</text><line x1="520" y1="185" x2="350" y2="400" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="680" y1="185" x2="850" y2="400" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="420" y1="455" x2="780" y2="455" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="465" y="300" width="270" height="90" rx="18" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="335" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="700"><tspan x="600" dy="0">可用模型能力</tspan><tspan x="600" dy="31">验证 Loss 与任务表现</tspan></text><text x="600" y="575" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">还要同时考虑推理延迟、显存、吞吐和数据合规。</text></svg>