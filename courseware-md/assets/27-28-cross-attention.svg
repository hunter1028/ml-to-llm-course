<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Encoder-Decoder 与 Cross-Attention</title><desc id="desc">Decoder 用 Query 读取 Encoder 输出的 Key 和 Value</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">Encoder-Decoder 与 Cross-Attention</text><rect x="70" y="190" width="300" height="210" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="220" y="240" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="28" font-weight="700">Encoder</text><text x="220" y="290" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="500"><tspan x="220" dy="0">完整读取输入</tspan><tspan x="220" dy="31">输出 Hencoder</tspan></text><rect x="830" y="190" width="300" height="210" rx="18" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="980" y="240" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="28" font-weight="700">Decoder</text><text x="980" y="290" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="500"><tspan x="980" dy="0">读取已生成内容</tspan><tspan x="980" dy="31">输出下一个 token</tspan></text><rect x="465" y="205" width="270" height="180" rx="18" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="255" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700">Cross-Attention</text><text x="600" y="305" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500"><tspan x="600" dy="0">Q：来自 Decoder</tspan><tspan x="600" dy="31">K/V：来自 Encoder</tspan></text><line x1="370" y1="295" x2="465" y2="295" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="735" y1="295" x2="830" y2="295" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="980" y1="190" x2="700" y2="150" stroke="#9333ea" stroke-width="3"  marker-end="url(#arrow)"/><text x="840" y="125" text-anchor="middle" fill="#9333ea" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700">Decoder 状态提供 Query</text><text x="600" y="520" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="500">输入端与输出端职责分开，适合翻译、摘要和条件转换。</text></svg>