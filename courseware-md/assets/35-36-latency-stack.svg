<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">大模型请求延迟分解</title><desc id="desc">用堆叠条展示网关排队、检索、Prefill、Decode 和校验耗时。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">一次大模型请求的延迟从哪里来</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">端到端 P95 延迟要拆成排队、检索、首 token 和逐 token 生成</text><rect x="80" y="245" width="76.0" height="105" fill="#2563EB"/><text x="118.0" y="285" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="118.0" dy="0">网关与排队</tspan><tspan x="118.0" dy="28">80 ms</tspan></text><rect x="156.0" y="245" width="123.5" height="105" fill="#0891B2"/><text x="217.75" y="285" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="217.75" dy="0">检索</tspan><tspan x="217.75" dy="28">130 ms</tspan></text><rect x="279.5" y="245" width="199.5" height="105" fill="#7C3AED"/><text x="379.25" y="285" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="379.25" dy="0">Prefill</tspan><tspan x="379.25" dy="28">210 ms</tspan></text><rect x="479.0" y="245" width="342.0" height="105" fill="#D97706"/><text x="650.0" y="285" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="650.0" dy="0">Decode</tspan><tspan x="650.0" dy="28">360 ms</tspan></text><rect x="821.0" y="245" width="104.5" height="105" fill="#059669"/><text x="873.25" y="285" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="873.25" dy="0">校验</tspan><tspan x="873.25" dy="28">110 ms</tspan></text><path d="M 80 385 L 925 385" stroke="#172033" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="500" y="420" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#172033" text-anchor="middle">示例端到端延迟：890 ms</text><rect x="70" y="470" width="250" height="85" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="195" y="505" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#2563EB" text-anchor="middle">排队</text><text x="195" y="535" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#526176" text-anchor="middle">并发控制、批处理</text><rect x="350" y="470" width="250" height="85" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="475" y="505" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#2563EB" text-anchor="middle">Prefill</text><text x="475" y="535" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#526176" text-anchor="middle">缩短 Prompt、前缀缓存</text><rect x="630" y="470" width="250" height="85" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="755" y="505" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#2563EB" text-anchor="middle">Decode</text><text x="755" y="535" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#526176" text-anchor="middle">小模型、量化、推测解码</text><rect x="910" y="470" width="250" height="85" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1035" y="505" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#2563EB" text-anchor="middle">系统</text><text x="1035" y="535" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#526176" text-anchor="middle">缓存、路由、超时降级</text></svg>