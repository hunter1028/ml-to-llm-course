<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">双方案分层路由</title><desc id="desc">按 XGBoost 风险概率分为直接升级、大模型复核和普通处理，并保留人工兜底。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">上线策略：分层路由而不是二选一</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">让 XGBoost 覆盖确定样本，让大模型处理灰区，并保留人工兜底</text><rect x="50" y="240" width="170" height="100" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="135" y="278" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#2563EB" text-anchor="middle"><tspan x="135" dy="0">工单进入</tspan><tspan x="135" dy="27">特征与文本</tspan></text><path d="M 220 290 L 325 290" stroke="#CBD5E1" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="325" y="225" width="200" height="130" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="425" y="267" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#059669" text-anchor="middle"><tspan x="425" dy="0">XGBoost</tspan><tspan x="425" dy="28">输出风险概率 p</tspan></text><path d="M 525 255 C 630 180, 670 165, 760 165" stroke="#059669" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="585" y="135" width="120" height="40" rx="20" fill="#059669" stroke="#059669" stroke-width="2"/><text x="645.0" y="162" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">p ≥ 0.85</text><rect x="760" y="115" width="200" height="100" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="860" y="153" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#059669" text-anchor="middle"><tspan x="860" dy="0">直接升级</tspan><tspan x="860" dy="26">快路径</tspan></text><path d="M 525 290 L 760 290" stroke="#7C3AED" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="585" y="240" width="140" height="40" rx="20" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="655.0" y="267" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.35 &lt; p &lt; 0.85</text><rect x="760" y="240" width="200" height="100" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="860" y="278" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#7C3AED" text-anchor="middle"><tspan x="860" dy="0">LLM 复核</tspan><tspan x="860" dy="26">补充理由</tspan></text><path d="M 525 325 C 630 410, 670 420, 760 420" stroke="#0891B2" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="585" y="390" width="120" height="40" rx="20" fill="#0891B2" stroke="#0891B2" stroke-width="2"/><text x="645.0" y="417" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">p ≤ 0.35</text><rect x="760" y="370" width="200" height="100" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/><text x="860" y="408" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#0891B2" text-anchor="middle"><tspan x="860" dy="0">普通处理</tspan><tspan x="860" dy="26">低成本路径</tspan></text><path d="M 960 290 L 1060 290" stroke="#CBD5E1" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1040" y="245" width="120" height="90" rx="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/><text x="1100" y="278" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" fill="#DC2626" text-anchor="middle"><tspan x="1100" dy="0">人工兜底</tspan><tspan x="1100" dy="24">异常/冲突</tspan></text><text x="600" y="555" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#172033" text-anchor="middle">阈值来自验证集和业务成本，不是凭感觉填写</text></svg>