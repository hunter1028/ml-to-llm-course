<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">线性回归从有波动的房价数据中学习总体趋势</title>
<desc id="desc">左侧展示七个不完全共线的面积房价数据点、拟合直线和九十五平方米的新预测，右侧展示数据、训练、参数和预测流程。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1200" height="620" rx="24" fill="#f8fafc"/>
<text x="60" y="66" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#0f172a">机器学习直觉：从有波动的数据中寻找总体规律</text>
<text x="60" y="100" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569">面积影响房价，但楼层、位置等因素会让真实成交价上下波动</text>

<rect x="56" y="128" width="700" height="430" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
<line x1="132" y1="494" x2="700" y2="494" stroke="#334155" stroke-width="2"/>
<line x1="132" y1="494" x2="132" y2="178" stroke="#334155" stroke-width="2"/>
<text x="385" y="540" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#334155">房屋面积 X（m²）</text>
<text x="76" y="345" transform="rotate(-90 76 345)" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#334155">房价 y（万元）</text>

<g font-family="Arial, sans-serif" font-size="14" fill="#64748b">
  <text x="135" y="518">50</text><text x="220" y="518">60</text><text x="305" y="518">70</text><text x="390" y="518">80</text><text x="475" y="518">90</text><text x="555" y="518">100</text><text x="640" y="518">110</text>
  <text x="95" y="482">150</text><text x="95" y="407">200</text><text x="95" y="332">250</text><text x="95" y="257">300</text><text x="95" y="182">350</text>
</g>
<g stroke="#e2e8f0" stroke-width="1">
  <line x1="132" y1="469" x2="700" y2="469"/><line x1="132" y1="394" x2="700" y2="394"/><line x1="132" y1="319" x2="700" y2="319"/><line x1="132" y1="244" x2="700" y2="244"/><line x1="132" y1="179" x2="700" y2="179"/>
</g>

<line x1="145" y1="472" x2="655" y2="221" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
<g fill="#2563eb" stroke="#ffffff" stroke-width="3">
  <circle cx="145" cy="467" r="9"/><circle cx="230" cy="430" r="9"/><circle cx="315" cy="394" r="9"/><circle cx="400" cy="352" r="9"/><circle cx="485" cy="302" r="9"/><circle cx="570" cy="266" r="9"/><circle cx="655" cy="217" r="9"/>
</g>
<circle cx="528" cy="284" r="12" fill="#16a34a" stroke="#ffffff" stroke-width="3"/>
<line x1="528" y1="284" x2="528" y2="494" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5" opacity="0.65"/>
<rect x="334" y="190" width="226" height="58" rx="10" fill="#fee2e2"/>
<text x="350" y="214" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">模型学到的总体趋势</text>
<text x="350" y="237" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">ŷ ≈ 2.79X + 15.43</text>
<rect x="540" y="272" width="148" height="50" rx="10" fill="#dcfce7"/>
<text x="552" y="293" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#15803d">95 m² 新预测</text>
<text x="552" y="313" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#166534">约 280.1 万元</text>

<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="790" y="134" width="350" height="84" rx="16" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="816" y="169" font-size="20" font-weight="700" fill="#1e3a8a">1. 准备历史数据</text>
  <text x="816" y="197" font-size="16" fill="#1e40af">7 个有真实波动的面积与房价</text>
  <line x1="965" y1="218" x2="965" y2="245" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="790" y="252" width="350" height="84" rx="16" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="816" y="287" font-size="20" font-weight="700" fill="#5b21b6">2. model.fit(X, y)</text>
  <text x="816" y="315" font-size="16" fill="#6d28d9">寻找全部数据总体误差更小的直线</text>
  <line x1="965" y1="336" x2="965" y2="363" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="790" y="370" width="350" height="84" rx="16" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="816" y="405" font-size="20" font-weight="700" fill="#92400e">3. 得到参数</text>
  <text x="816" y="433" font-size="16" fill="#a16207">斜率 ≈ 2.79，截距 ≈ 15.43</text>
  <line x1="965" y1="454" x2="965" y2="481" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="790" y="488" width="350" height="84" rx="16" fill="#dcfce7" stroke="#86efac"/>
  <text x="816" y="523" font-size="20" font-weight="700" fill="#166534">4. model.predict([[95]])</text>
  <text x="816" y="551" font-size="16" fill="#15803d">95 m² 预测价格 ≈ 280.1 万元</text>
</g>
</svg>
