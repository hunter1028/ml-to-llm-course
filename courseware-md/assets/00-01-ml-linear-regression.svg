<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">线性回归从历史数据学习直线并预测新房价格</title>
<desc id="desc">左侧展示面积和房价数据点及模型学到的直线，右侧展示数据、训练、参数和预测的机器学习最小闭环。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1200" height="620" rx="24" fill="#f8fafc"/>
<text x="60" y="66" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#0f172a">机器学习最小直觉：从数据中学出一条规律</text>
<text x="60" y="100" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569">例子：面积每增加 1 m²，房价约增加 3 万元</text>

<rect x="56" y="128" width="700" height="430" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
<line x1="132" y1="494" x2="700" y2="494" stroke="#334155" stroke-width="2"/>
<line x1="132" y1="494" x2="132" y2="178" stroke="#334155" stroke-width="2"/>
<text x="385" y="540" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#334155">房屋面积 X（m²）</text>
<text x="76" y="345" transform="rotate(-90 76 345)" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#334155">房价 y（万元）</text>

<g font-family="Arial, sans-serif" font-size="14" fill="#64748b">
  <text x="118" y="518">50</text><text x="227" y="518">60</text><text x="337" y="518">70</text><text x="447" y="518">80</text><text x="557" y="518">90</text><text x="662" y="518">100</text>
  <text x="95" y="470">150</text><text x="95" y="397">180</text><text x="95" y="324">210</text><text x="95" y="251">240</text><text x="95" y="178">270</text>
</g>
<g stroke="#e2e8f0" stroke-width="1">
  <line x1="132" y1="446" x2="700" y2="446"/><line x1="132" y1="373" x2="700" y2="373"/><line x1="132" y1="300" x2="700" y2="300"/><line x1="132" y1="227" x2="700" y2="227"/>
</g>
<line x1="145" y1="461" x2="675" y2="165" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
<g fill="#2563eb" stroke="#ffffff" stroke-width="3">
  <circle cx="145" cy="461" r="9"/><circle cx="255" cy="402" r="9"/><circle cx="365" cy="343" r="9"/><circle cx="475" cy="284" r="9"/><circle cx="585" cy="225" r="9"/>
</g>
<circle cx="675" cy="165" r="11" fill="#16a34a" stroke="#ffffff" stroke-width="3"/>
<rect x="478" y="145" width="165" height="54" rx="10" fill="#fee2e2"/>
<text x="494" y="169" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">学到的规律</text>
<text x="494" y="189" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">ŷ = 3 × X</text>
<text x="632" y="147" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#15803d">新预测：300</text>

<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="790" y="134" width="350" height="84" rx="16" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="816" y="169" font-size="20" font-weight="700" fill="#1e3a8a">1. 准备历史数据</text>
  <text x="816" y="197" font-size="16" fill="#1e40af">X = 面积，y = 已知房价</text>
  <line x1="965" y1="218" x2="965" y2="245" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="790" y="252" width="350" height="84" rx="16" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="816" y="287" font-size="20" font-weight="700" fill="#5b21b6">2. model.fit(X, y)</text>
  <text x="816" y="315" font-size="16" fill="#6d28d9">训练就是寻找误差更小的参数</text>
  <line x1="965" y1="336" x2="965" y2="363" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="790" y="370" width="350" height="84" rx="16" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="816" y="405" font-size="20" font-weight="700" fill="#92400e">3. 得到参数</text>
  <text x="816" y="433" font-size="16" fill="#a16207">斜率 = 3，截距 = 0</text>
  <line x1="965" y1="454" x2="965" y2="481" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="790" y="488" width="350" height="84" rx="16" fill="#dcfce7" stroke="#86efac"/>
  <text x="816" y="523" font-size="20" font-weight="700" fill="#166534">4. model.predict([[100]])</text>
  <text x="816" y="551" font-size="16" fill="#15803d">新房预测价格 = 300 万元</text>
</g>
</svg>