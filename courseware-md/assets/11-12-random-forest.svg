<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg{fill:#fbfcff} .card{fill:#ffffff;stroke:#d8dee9;stroke-width:1.4;rx:14}
      .axis{stroke:#5b6472;stroke-width:1.5} .grid{stroke:#e7ebf2;stroke-width:1}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:15px;fill:#4a5568} .title{font-size:24px;font-weight:700;fill:#111827}
      .blue{fill:#3b82f6} .red{fill:#ef4444} .green{fill:#10b981} .orange{fill:#f59e0b} .purple{fill:#8b5cf6}
      .line-blue{stroke:#3b82f6;stroke-width:3;fill:none} .line-red{stroke:#ef4444;stroke-width:3;fill:none}
      .line-green{stroke:#10b981;stroke-width:3;fill:none} .line-orange{stroke:#f59e0b;stroke-width:3;fill:none}
      .dash{stroke-dasharray:8 7} .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420"/>

  <text class="title" x="36" y="42">随机森林：多棵弱相关树投票，降低方差</text>
  <rect class="card" x="45" y="75" width="830" height="295"/>
  <rect x="80" y="115" width="125" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text class="small" x="103" y="148">训练数据</text>
  <path class="axis arrow" d="M210 143 C260 95,315 100,360 128"/><path class="axis arrow" d="M210 143 C275 143,315 143,360 143"/><path class="axis arrow" d="M210 143 C260 195,315 185,360 160"/>
  <rect x="360" y="88" width="130" height="45" rx="9" fill="#ecfdf5" stroke="#10b981"/><text class="small" x="383" y="116">抽样子集1</text>
  <rect x="360" y="135" width="130" height="45" rx="9" fill="#ecfdf5" stroke="#10b981"/><text class="small" x="383" y="163">抽样子集2</text>
  <rect x="360" y="182" width="130" height="45" rx="9" fill="#ecfdf5" stroke="#10b981"/><text class="small" x="383" y="210">抽样子集3</text>
  <text class="small" x="270" y="245">行随机 + 特征随机</text>
  <path class="axis arrow" d="M495 110 L595 110"/><path class="axis arrow" d="M495 157 L595 157"/><path class="axis arrow" d="M495 204 L595 204"/>
  <rect x="595" y="88" width="86" height="45" rx="9" fill="#fff7ed" stroke="#f59e0b"/><text class="small" x="615" y="116">树1</text>
  <rect x="595" y="135" width="86" height="45" rx="9" fill="#fff7ed" stroke="#f59e0b"/><text class="small" x="615" y="163">树2</text>
  <rect x="595" y="182" width="86" height="45" rx="9" fill="#fff7ed" stroke="#f59e0b"/><text class="small" x="615" y="210">树3</text>
  <path class="axis arrow" d="M685 110 C735 120,750 135,770 154"/><path class="axis arrow" d="M685 157 L770 157"/><path class="axis arrow" d="M685 204 C735 190,750 175,770 160"/>
  <rect x="770" y="130" width="75" height="55" rx="10" fill="#fef2f2" stroke="#ef4444"/><text class="small" x="790" y="162">投票</text>
  <text class="small" x="90" y="325">单树容易过拟合；森林通过平均/投票让预测更稳</text>

</svg>