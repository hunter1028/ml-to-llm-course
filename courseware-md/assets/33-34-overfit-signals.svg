<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">微调过拟合信号</title><desc id="desc">训练损失持续下降而验证损失回升，并列出常见原因和处理方法。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">微调过拟合：训练 Loss 下降，不代表泛化变好</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">同时看验证集、生成样例、格式通过率与基座能力回归</text><path d="M 90 500 L 565 500" stroke="#172033" stroke-width="2" fill="none"/><path d="M 90 500 L 90 145" stroke="#172033" stroke-width="2" fill="none"/><text x="330" y="545" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#526176" text-anchor="middle">训练步数</text><text x="35" y="320" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#526176" text-anchor="middle">Loss</text><path d="M 100 190 C 210 260, 350 390, 545 455" stroke="#2563EB" stroke-width="5" fill="none"/><text x="505" y="430" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="start">训练 Loss</text><path d="M 100 220 C 230 330, 330 390, 420 360 C 475 340, 510 300, 545 235" stroke="#DC2626" stroke-width="5" fill="none"/><text x="480" y="215" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#DC2626" text-anchor="start">验证 Loss 回升</text><path d="M 415 155 L 415 500" stroke="#D97706" stroke-width="3" fill="none" stroke-dasharray="8 8"/><rect x="335" y="112" width="160" height="40" rx="20" fill="#D97706" stroke="#D97706" stroke-width="2"/><text x="415.0" y="139" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">早停候选点</text><rect x="640" y="145" width="500" height="355" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="680" cy="200" r="12" fill="#DC2626" stroke="#DC2626" stroke-width="2"/><text x="710" y="198" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#DC2626" text-anchor="start">数据重复</text><text x="710" y="225" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="500" fill="#526176" text-anchor="start">少量模板被反复记忆</text><circle cx="680" cy="272" r="12" fill="#D97706" stroke="#D97706" stroke-width="2"/><text x="710" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#D97706" text-anchor="start">学习率过大</text><text x="710" y="297" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="500" fill="#526176" text-anchor="start">回答风格突变、能力遗忘</text><circle cx="680" cy="344" r="12" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="710" y="342" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#7C3AED" text-anchor="start">训练轮数过多</text><text x="710" y="369" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="500" fill="#526176" text-anchor="start">训练集很好，验证集变差</text><circle cx="680" cy="416" r="12" fill="#0891B2" stroke="#0891B2" stroke-width="2"/><text x="710" y="414" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#0891B2" text-anchor="start">评测过窄</text><text x="710" y="441" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="500" fill="#526176" text-anchor="start">只看 Loss，不看真实生成</text><text x="890" y="465" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">对策：去重、降学习率、早停、扩大评测集</text></svg>