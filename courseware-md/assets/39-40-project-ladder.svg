font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="end">成本、延迟、稳定、监控</text><rect x="440.0" y="153" width="320" height="62" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="468.0" y="192" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#7C3AED" text-anchor="start">5 可复现</text><text x="732.0" y="192" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="end">数据版本、配置、报告、演示</text><text x="600" y="555" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#172033" text-anchor="middle">面试官真正关心：你做了什么决策、依据是什么、失败后怎样迭代</text></svg>