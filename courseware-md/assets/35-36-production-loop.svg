<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">大模型生产链路</title><desc id="desc">展示业务请求经过安全、检索、路由、模型、校验和观测后形成生产服务。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">从 Demo 到生产系统</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">模型只是链路中的一个组件，交付的是可监控、可降级、可回滚的服务</text><rect x="30" y="220" width="140" height="100" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="100" y="262" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#2563EB" text-anchor="middle"><tspan x="100" dy="0">业务请求</tspan></text><path d="M 170 270 L 196 270" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="196" y="220" width="140" height="100" rx="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/><text x="266" y="262" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#DC2626" text-anchor="middle"><tspan x="266" dy="0">安全</tspan><tspan x="266" dy="26">权限</tspan></text><path d="M 336 270 L 362 270" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="362" y="220" width="140" height="100" rx="16" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/><text x="432" y="262" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#0891B2" text-anchor="middle"><tspan x="432" dy="0">检索/特征</tspan></text><path d="M 502 270 L 528 270" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="528" y="220" width="140" height="100" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="598" y="262" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#7C3AED" text-anchor="middle"><tspan x="598" dy="0">模型路由</tspan></text><path d="M 668 270 L 694 270" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="694" y="220" width="140" height="100" rx="16" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="764" y="262" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#D97706" text-anchor="middle"><tspan x="764" dy="0">生成/预测</tspan></text><path d="M 834 270 L 860 270" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="860" y="220" width="140" height="100" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="2"/><text x="930" y="262" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#059669" text-anchor="middle"><tspan x="930" dy="0">校验</tspan><tspan x="930" dy="26">后处理</tspan></text><path d="M 1000 270 L 1026 270" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1026" y="220" width="140" height="100" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="1096" y="262" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#2563EB" text-anchor="middle"><tspan x="1096" dy="0">业务响应</tspan></text><rect x="250" y="405" width="700" height="105" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="600" y="440" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="middle">贯穿全链路：Tracing · 指标 · 日志 · 成本 · 质量抽检</text><text x="600" y="478" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#526176" text-anchor="middle">异常样本进入评测集和数据回流，而不是只留在日志里</text><path d="M 100 320 L 100 405" stroke="#526176" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 7"/><path d="M 432 320 L 432 405" stroke="#526176" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 7"/><path d="M 764 320 L 764 405" stroke="#526176" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 7"/><path d="M 1096 320 L 1096 405" stroke="#526176" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 7"/></svg>