<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">微调方式对比</title><desc id="desc">对比全量微调、冻结主干、LoRA 和 QLoRA 的参数更新范围与工程特点。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">四种参数适配方式</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">选择依据不是“越省显存越好”，而是任务、数据、硬件和可维护性</text><rect x="45" y="145" width="255" height="340" rx="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/><rect x="73" y="170" width="199" height="40" rx="20" fill="#DC2626" stroke="#DC2626" stroke-width="2"/><text x="172.5" y="197" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">全量微调</text><text x="172" y="255" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">更新全部参数</text><path d="M 80 280 L 265 280" stroke="#CBD5E1" stroke-width="2" fill="none"/><text x="172" y="325" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#DC2626" text-anchor="middle">显存最高</text><text x="172" y="372" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#526176" text-anchor="middle">能力改动大</text><rect x="88" y="410" width="15" height="32" rx="4" fill="#DC2626"/><rect x="110" y="410" width="15" height="32" rx="4" fill="#DC2626"/><rect x="132" y="410" width="15" height="32" rx="4" fill="#DC2626"/><rect x="154" y="410" width="15" height="32" rx="4" fill="#DC2626"/><rect x="176" y="410" width="15" height="32" rx="4" fill="#DC2626"/><rect x="198" y="410" width="15" height="32" rx="4" fill="#DC2626"/><rect x="220" y="410" width="15" height="32" rx="4" fill="#DC2626"/><rect x="242" y="410" width="15" height="32" rx="4" fill="#DC2626"/><text x="172" y="465" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#526176" text-anchor="middle">彩色块表示可训练参数比例</text><rect x="333" y="145" width="255" height="340" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="3"/><rect x="361" y="170" width="199" height="40" rx="20" fill="#0891B2" stroke="#0891B2" stroke-width="2"/><text x="460.5" y="197" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">冻结主干</text><text x="460" y="255" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">只训任务头</text><path d="M 368 280 L 553 280" stroke="#CBD5E1" stroke-width="2" fill="none"/><text x="460" y="325" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0891B2" text-anchor="middle">成本最低</text><text x="460" y="372" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#526176" text-anchor="middle">适合分类头</text><rect x="376" y="410" width="15" height="32" rx="4" fill="#0891B2"/><rect x="398" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="420" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="442" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="464" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="486" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="508" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="530" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><text x="460" y="465" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#526176" text-anchor="middle">彩色块表示可训练参数比例</text><rect x="621" y="145" width="255" height="340" rx="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/><rect x="649" y="170" width="199" height="40" rx="20" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="748.5" y="197" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">LoRA</text><text x="748" y="255" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">训练低秩增量</text><path d="M 656 280 L 841 280" stroke="#CBD5E1" stroke-width="2" fill="none"/><text x="748" y="325" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="middle">成本较低</text><text x="748" y="372" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#526176" text-anchor="middle">多任务适配</text><rect x="664" y="410" width="15" height="32" rx="4" fill="#7C3AED"/><rect x="686" y="410" width="15" height="32" rx="4" fill="#7C3AED"/><rect x="708" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="730" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="752" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="774" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="796" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="818" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><text x="748" y="465" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#526176" text-anchor="middle">彩色块表示可训练参数比例</text><rect x="909" y="145" width="255" height="340" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="3"/><rect x="937" y="170" width="199" height="40" rx="20" fill="#059669" stroke="#059669" stroke-width="2"/><text x="1036.5" y="197" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">QLoRA</text><text x="1036" y="255" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">4-bit 基座 + LoRA</text><path d="M 944 280 L 1129 280" stroke="#CBD5E1" stroke-width="2" fill="none"/><text x="1036" y="325" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">显存更低</text><text x="1036" y="372" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#526176" text-anchor="middle">训练更复杂</text><rect x="952" y="410" width="15" height="32" rx="4" fill="#059669"/><rect x="974" y="410" width="15" height="32" rx="4" fill="#059669"/><rect x="996" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="1018" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="1040" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="1062" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="1084" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><rect x="1106" y="410" width="15" height="32" rx="4" fill="#E2E8F0"/><text x="1036" y="465" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#526176" text-anchor="middle">彩色块表示可训练参数比例</text><text x="600" y="550" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">QLoRA 节省的是基座权重存储；激活、优化器状态和数据长度仍会占用显存</text></svg>