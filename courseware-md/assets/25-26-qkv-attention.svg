<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Q、K、V 与注意力计算</title><desc id="desc">Query 负责查询，Key 负责匹配，Value 提供汇总内容</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">Q、K、V 与注意力计算</text><rect x="60" y="220" width="170" height="90" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="145" y="275" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="27" font-weight="700">输入 X</text><rect x="330" y="120" width="190" height="85" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="425" y="172" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="23" font-weight="700">Q = XWQ</text><line x1="230" y1="265" x2="330" y2="162" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="330" y="250" width="190" height="85" rx="18" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="425" y="302" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="23" font-weight="700">K = XWK</text><line x1="230" y1="265" x2="330" y2="292" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="330" y="380" width="190" height="85" rx="18" fill="#ffedd5" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="425" y="432" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="23" font-weight="700">V = XWV</text><line x1="230" y1="265" x2="330" y2="422" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="620" y="145" width="250" height="115" rx="18" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="745" y="190" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" font-weight="700"><tspan x="745" dy="0">QKᵀ / √dk</tspan><tspan x="745" dy="31">相关性分数</tspan></text><line x1="520" y1="162" x2="620" y2="190" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="520" y1="292" x2="620" y2="215" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="930" y="145" width="200" height="115" rx="18" fill="#fee2e2" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1030" y="190" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="23" font-weight="700"><tspan x="1030" dy="0">Mask</tspan><tspan x="1030" dy="31">+ Softmax</tspan></text><line x1="870" y1="202" x2="930" y2="202" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="720" y="390" width="250" height="105" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="845" y="430" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="23" font-weight="700"><tspan x="845" dy="0">注意力权重 × V</tspan><tspan x="845" dy="31">得到新表示</tspan></text><line x1="1030" y1="260" x2="920" y2="390" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="520" y1="422" x2="720" y2="442" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><text x="600" y="570" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="500">匹配依据（Q/K）与被读取内容（V）分开学习。</text></svg>