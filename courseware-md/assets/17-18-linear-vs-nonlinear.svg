<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460">

  <defs>
    <style>
      .bg{fill:#fbfcff}.card{fill:#fff;stroke:#d8dee9;stroke-width:1.4}.soft{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:14px;fill:#4a5568}.title{font-size:24px;font-weight:700;fill:#111827}.mini{font-size:12px;fill:#64748b}
      .blue{fill:#3b82f6}.red{fill:#ef4444}.green{fill:#10b981}.orange{fill:#f59e0b}.purple{fill:#8b5cf6}.gray{fill:#64748b}
      .line{stroke:#475569;stroke-width:2;fill:none}.dash{stroke-dasharray:7 6}.arrow{marker-end:url(#arrow)}
      .blueLine{stroke:#3b82f6;stroke-width:3;fill:none}.redLine{stroke:#ef4444;stroke-width:3;fill:none}.greenLine{stroke:#10b981;stroke-width:3;fill:none}.orangeLine{stroke:#f59e0b;stroke-width:3;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>

  <rect class="bg" width="920" height="460"/>
  <text class="title" x="36" y="42">线性边界为什么不够：一个规则切不出复杂区域</text>
  <rect class="card" x="50" y="75" width="385" height="320" rx="16"/>
  <rect class="card" x="485" y="75" width="385" height="320" rx="16"/>
  <text class="txt" x="82" y="112">单条直线：全局同一规则</text>
  <line class="line" x1="105" y1="340" x2="390" y2="340"/><line class="line" x1="105" y1="340" x2="105" y2="135"/>
  <text class="mini" x="382" y="360">x₁</text><text class="mini" x="82" y="145">x₂</text>
  <circle class="red" cx="145" cy="300" r="9"/><text class="mini" x="128" y="323">0,0</text>
  <circle class="red" cx="350" cy="165" r="9"/><text class="mini" x="330" y="188">1,1</text>
  <circle class="blue" cx="350" cy="300" r="9"/><text class="mini" x="332" y="323">1,0</text>
  <circle class="blue" cx="145" cy="165" r="9"/><text class="mini" x="127" y="188">0,1</text>
  <line class="redLine dash" x1="125" y1="230" x2="382" y2="230"/>
  <text class="small" x="82" y="383">XOR：蓝点和红点交错，单线无法分开</text>

  <text class="txt" x="517" y="112">多层非线性：分段组合规则</text>
  <line class="line" x1="540" y1="340" x2="825" y2="340"/><line class="line" x1="540" y1="340" x2="540" y2="135"/>
  <text class="mini" x="817" y="360">x₁</text><text class="mini" x="517" y="145">x₂</text>
  <circle class="red" cx="580" cy="300" r="9"/><circle class="red" cx="785" cy="165" r="9"/>
  <circle class="blue" cx="785" cy="300" r="9"/><circle class="blue" cx="580" cy="165" r="9"/>
  <path class="greenLine" d="M560 245 C610 210,645 205,682 242 S760 280,815 230"/>
  <path class="orangeLine dash" d="M640 330 C640 280,645 220,680 135"/>
  <text class="small" x="517" y="383">多个神经元像多把尺子：组合后形成弯折边界</text>
</svg>
