<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">RLHF 的生成、评分与更新闭环</title><desc id="desc">Policy 采样回答，RM 打分，KL 约束策略不要偏离参考模型过远</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">RLHF 的生成、评分与更新闭环</text><rect x="70" y="210" width="160" height="100" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="150" y="249" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700">Prompt</text><rect x="280" y="140" width="160" height="100" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="360" y="179" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700">Policy</text><text x="360" y="212" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" font-weight="500">生成回答</text><rect x="535" y="140" width="190" height="100" rx="18" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="630" y="179" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700">Reward Model</text><text x="630" y="212" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" font-weight="500">偏好分数</text><rect x="790" y="140" width="160" height="100" rx="18" fill="#ffedd5" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="870" y="179" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700">奖励 - KL</text><text x="870" y="212" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" font-weight="500">优势信号</text><rect x="1010" y="210" width="160" height="100" rx="18" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1090" y="249" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700">PPO</text><text x="1090" y="282" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" font-weight="500">更新策略</text><line x1="230" y1="260" x2="280" y2="190" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="440" y1="190" x2="535" y2="190" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="725" y1="190" x2="790" y2="190" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="950" y1="190" x2="1010" y2="260" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1090 315 C 1030 500, 390 510, 360 245" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/><rect x="520" y="390" width="230" height="80" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="635" y="423" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" font-weight="700"><tspan x="635" dy="0">Reference Model</tspan><tspan x="635" dy="31">提供 KL 基准</tspan></text><line x1="635" y1="390" x2="850" y2="240" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><text x="600" y="570" text-anchor="middle" fill="#dc2626" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700">若奖励设计有漏洞，Policy 可能学会“拿高分”而不是真正完成目标。</text></svg>