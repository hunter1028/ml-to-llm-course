<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">传统模型与大模型双方案</title><desc id="desc">统一数据分别进入 XGBoost 传统方案和大模型方案，再由统一评测器比较。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">同一工单任务的双方案</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">共同目标：预测是否升级；不同优势：传统模型稳定，大模型理解长文本</text><rect x="45" y="145" width="220" height="330" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="155" y="190" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="800" fill="#172033" text-anchor="middle">统一数据集</text><rect x="75" y="225" width="160" height="40" rx="20" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="155.0" y="252" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">工单文本</text><rect x="75" y="280" width="160" height="40" rx="20" fill="#0891B2" stroke="#0891B2" stroke-width="2"/><text x="155.0" y="307" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">渠道与商品</text><rect x="75" y="335" width="160" height="40" rx="20" fill="#D97706" stroke="#D97706" stroke-width="2"/><text x="155.0" y="362" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">历史次数</text><rect x="75" y="390" width="160" height="40" rx="20" fill="#DC2626" stroke="#DC2626" stroke-width="2"/><text x="155.0" y="417" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">升级标签</text><path d="M 265 270 C 350 270, 350 220, 420 220" stroke="#059669" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 265 350 C 350 350, 350 405, 420 405" stroke="#7C3AED" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="420" y="140" width="310" height="165" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="575" y="182" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800" fill="#059669" text-anchor="middle">传统方案</text><text x="575" y="220" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="middle"><tspan x="575" dy="0">TF-IDF / 结构化特征</tspan><tspan x="575" dy="29">XGBoost → 风险概率</tspan></text><rect x="420" y="335" width="310" height="165" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="575" y="377" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800" fill="#7C3AED" text-anchor="middle">大模型方案</text><text x="575" y="415" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="middle"><tspan x="575" dy="0">Prompt 或 LoRA</tspan><tspan x="575" dy="29">JSON → 风险 + 理由</tspan></text><path d="M 730 222 L 820 300" stroke="#CBD5E1" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 730 418 L 820 330" stroke="#CBD5E1" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="820" y="230" width="330" height="170" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="985" y="275" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800" fill="#2563EB" text-anchor="middle">统一评测器</text><text x="985" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#526176" text-anchor="middle"><tspan x="985" dy="0">Recall · F1 · P95 延迟</tspan><tspan x="985" dy="28">单次成本 · 格式通过率</tspan></text><text x="600" y="555" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#DC2626" text-anchor="middle">禁止用不同数据切分或不同标签口径制造“方案领先”</text></svg>