<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg{fill:#fbfcff} .card{fill:#ffffff;stroke:#d8dee9;stroke-width:1.4;rx:14}
      .axis{stroke:#5b6472;stroke-width:1.5} .grid{stroke:#e7ebf2;stroke-width:1}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:15px;fill:#4a5568} .title{font-size:24px;font-weight:700;fill:#111827}
      .blue{fill:#3b82f6} .red{fill:#ef4444} .green{fill:#10b981} .orange{fill:#f59e0b} .purple{fill:#8b5cf6}
      .line-blue{stroke:#3b82f6;stroke-width:3;fill:none} .line-red{stroke:#ef4444;stroke-width:3;fill:none}
      .line-green{stroke:#10b981;stroke-width:3;fill:none} .line-orange{stroke:#f59e0b;stroke-width:3;fill:none}
      .dash{stroke-dasharray:8 7} .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420"/>

  <text class="title" x="36" y="42">神经元：加权求和 + 非线性激活</text>
  <rect class="card" x="45" y="75" width="830" height="295"/>
  <circle class="blue" cx="120" cy="135" r="22"/><text class="txt" x="110" y="142">x₁</text>
  <circle class="blue" cx="120" cy="205" r="22"/><text class="txt" x="110" y="212">x₂</text>
  <circle class="blue" cx="120" cy="275" r="22"/><text class="txt" x="110" y="282">x₃</text>
  <line class="axis arrow" x1="145" y1="135" x2="330" y2="190"/><text class="small" x="210" y="145">w₁</text>
  <line class="axis arrow" x1="145" y1="205" x2="330" y2="205"/><text class="small" x="210" y="197">w₂</text>
  <line class="axis arrow" x1="145" y1="275" x2="330" y2="220"/><text class="small" x="210" y="270">w₃</text>
  <circle cx="385" cy="205" r="58" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="txt" x="340" y="196">z=w·x+b</text><text class="small" x="350" y="225">线性部分</text>
  <path class="axis arrow" d="M445 205 L555 205"/><text class="small" x="470" y="185">激活函数</text>
  <rect x="555" y="162" width="135" height="86" rx="14" fill="#ecfdf5" stroke="#10b981"/>
  <text class="txt" x="590" y="196">a=σ(z)</text><text class="small" x="585" y="225">非线性输出</text>
  <path class="axis arrow" d="M695 205 L790 205"/>
  <text class="txt" x="795" y="212">下一层</text>
  <text class="small" x="115" y="345">没有激活函数，多层线性叠加仍等价于一层线性模型</text>

</svg>