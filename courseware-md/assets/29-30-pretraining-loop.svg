<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">大模型预训练闭环</title><desc id="desc">从清洗语料到 token 预测损失，再反向更新所有可训练参数</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">大模型预训练闭环</text><rect x="40" y="245" width="130" height="82" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="105" y="278" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700"><tspan x="105" dy="0">清洗语料</tspan></text><rect x="205" y="245" width="130" height="82" rx="18" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="270" y="278" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700"><tspan x="270" dy="0">Tokenizer</tspan></text><rect x="370" y="245" width="130" height="82" rx="18" fill="#ffedd5" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="435" y="278" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700"><tspan x="435" dy="0">训练序列</tspan></text><rect x="535" y="245" width="130" height="82" rx="18" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="278" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700"><tspan x="600" dy="0">Transformer</tspan></text><rect x="700" y="245" width="130" height="82" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="765" y="278" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700"><tspan x="765" dy="0">词表</tspan><tspan x="765" dy="23">logits</tspan></text><rect x="865" y="245" width="130" height="82" rx="18" fill="#fee2e2" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="930" y="278" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700"><tspan x="930" dy="0">交叉熵</tspan><tspan x="930" dy="23">Loss</tspan></text><rect x="1030" y="245" width="130" height="82" rx="18" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1095" y="278" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700"><tspan x="1095" dy="0">反向更新</tspan></text><line x1="170" y1="286" x2="205" y2="286" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="335" y1="286" x2="370" y2="286" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="500" y1="286" x2="535" y2="286" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="665" y1="286" x2="700" y2="286" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="830" y1="286" x2="865" y2="286" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="995" y1="286" x2="1030" y2="286" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1095 335 C 1080 500, 590 520, 600 345" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/><text x="830" y="505" text-anchor="middle" fill="#16a34a" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700">梯度更新 Embedding、Attention、FFN 等参数</text><text x="600" y="150" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="500">重复处理海量 token，逐步降低正确 token 的负对数概率</text></svg>