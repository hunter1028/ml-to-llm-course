<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">LoRA 低秩适配机制</title><desc id="desc">冻结基座权重，通过可训练的低秩矩阵 A 和 B 构造权重增量。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">LoRA：冻结主干，只训练低秩增量</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">一次线性变换从 W₀x 变为 W₀x + (α/r)BAx</text><rect x="55" y="150" width="250" height="260" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="180" y="205" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="middle"><tspan x="180" dy="0">输入向量 x</tspan></text><path d="M 180 235 L 180 285" stroke="#2563EB" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="85" y="290" width="190" height="80" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="180" y="325" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle"><tspan x="180" dy="0">冻结权重 W₀</tspan><tspan x="180" dy="25">不参与更新</tspan></text><path d="M 180 370 L 180 445" stroke="#2563EB" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="355" y="150" width="430" height="330" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><rect x="380" y="175" width="150" height="40" rx="20" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="455.0" y="202" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">可训练支路</text><rect x="400" y="245" width="135" height="75" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="467" y="276" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle"><tspan x="467" dy="0">A：降维</tspan><tspan x="467" dy="23">d → r</tspan></text><path d="M 535 282 L 610 282" stroke="#7C3AED" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="610" y="245" width="135" height="75" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="677" y="276" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle"><tspan x="677" dy="0">B：升维</tspan><tspan x="677" dy="23">r → d</tspan></text><text x="570" y="355" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#7C3AED" text-anchor="middle">r 远小于 d</text><text x="570" y="390" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#526176" text-anchor="middle">新增参数约为 r(din + dout)</text><path d="M 180 235 C 300 235, 320 210, 400 282" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 745 282 C 840 282, 820 445, 860 445" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 180 445 L 860 445" stroke="#2563EB" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="890" cy="445" r="28" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="890" y="453" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="800" fill="#059669" text-anchor="middle">+</text><path d="M 918 445 L 1060 445" stroke="#059669" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1030" y="405" width="120" height="80" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="1090" y="438" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="middle"><tspan x="1090" dy="0">输出 h</tspan></text><text x="570" y="535" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">训练时梯度只更新 A、B；推理时可保留适配器，也可把增量合并回 W₀</text></svg>