<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg{fill:#fbfcff} .card{fill:#ffffff;stroke:#d8dee9;stroke-width:1.4;rx:14}
      .axis{stroke:#5b6472;stroke-width:1.5} .grid{stroke:#e7ebf2;stroke-width:1}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:15px;fill:#4a5568} .title{font-size:24px;font-weight:700;fill:#111827}
      .blue{fill:#3b82f6} .red{fill:#ef4444} .green{fill:#10b981} .orange{fill:#f59e0b} .purple{fill:#8b5cf6}
      .line-blue{stroke:#3b82f6;stroke-width:3;fill:none} .line-red{stroke:#ef4444;stroke-width:3;fill:none}
      .line-green{stroke:#10b981;stroke-width:3;fill:none} .line-orange{stroke:#f59e0b;stroke-width:3;fill:none}
      .dash{stroke-dasharray:8 7} .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420"/>

  <text class="title" x="36" y="42">CNN 流水线：局部特征逐层组合成高级语义</text>
  <rect class="card" x="45" y="75" width="830" height="295"/>
  <rect x="70" y="155" width="100" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text class="small" x="96" y="190">图像</text>
  <path class="axis arrow" d="M175 185 L245 185"/>
  <rect x="245" y="140" width="115" height="90" rx="12" fill="#ecfdf5" stroke="#10b981"/><text class="small" x="282" y="170">卷积</text><text class="small" x="268" y="197">边缘/纹理</text>
  <path class="axis arrow" d="M365 185 L435 185"/>
  <rect x="435" y="140" width="115" height="90" rx="12" fill="#ecfdf5" stroke="#10b981"/><text class="small" x="472" y="170">卷积</text><text class="small" x="454" y="197">部件/形状</text>
  <path class="axis arrow" d="M555 185 L625 185"/>
  <rect x="625" y="140" width="115" height="90" rx="12" fill="#fff7ed" stroke="#f59e0b"/><text class="small" x="656" y="170">全连接</text><text class="small" x="660" y="197">分类头</text>
  <path class="axis arrow" d="M745 185 L815 185"/>
  <text class="txt" x="805" y="192">类别</text>
  <text class="small" x="105" y="310">浅层看局部纹理，深层看组合语义；感受野随层数扩大</text>

</svg>