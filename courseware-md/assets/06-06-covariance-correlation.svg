<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <style>
    .bg{fill:#fbfcff}.panel{fill:#fff;stroke:#d7dfef;stroke-width:1.5;rx:16}.title{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#162033}.sub{font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#4b5870}.label{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#263348}.small{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#5b667a}.axis{stroke:#9aa7bc;stroke-width:1.2}.dot{fill:#2f6fed;opacity:.85}.dot2{fill:#ea4335;opacity:.85}.dot3{fill:#7b8798;opacity:.85}.line{stroke:#111827;stroke-width:2}.formula{font:600 17px 'SFMono-Regular','Menlo','Consolas',monospace;fill:#263348}.mat{fill:#eef4ff;stroke:#2f6fed;stroke-width:1.4;rx:8}.cell{fill:#fff;stroke:#b7c4da;stroke-width:1}
  </style>
  <rect class="bg" width="1100" height="430"/>
  <text class="title" x="40" y="44">协方差与相关系数：两个变量是否一起动</text>
  <text class="sub" x="40" y="72">协方差看同涨同跌的方向和强度；相关系数把量纲消掉，范围固定在 [-1,1]。</text>

  <rect class="panel" x="40" y="100" width="300" height="250"/>
  <text class="label" x="65" y="130">正相关：Cov &gt; 0</text>
  <line class="axis" x1="75" y1="300" x2="305" y2="300"/><line class="axis" x1="75" y1="300" x2="75" y2="160"/>
  <line class="line" x1="95" y1="280" x2="285" y2="175"/>
  <circle class="dot" cx="100" cy="275" r="5"/><circle class="dot" cx="135" cy="255" r="5"/><circle class="dot" cx="170" cy="235" r="5"/><circle class="dot" cx="205" cy="210" r="5"/><circle class="dot" cx="245" cy="195" r="5"/><circle class="dot" cx="280" cy="180" r="5"/>
  <text class="small" x="120" y="330">面积 ↑，房价 ↑</text>

  <rect class="panel" x="400" y="100" width="300" height="250"/>
  <text class="label" x="425" y="130">负相关：Cov &lt; 0</text>
  <line class="axis" x1="435" y1="300" x2="665" y2="300"/><line class="axis" x1="435" y1="300" x2="435" y2="160"/>
  <line class="line" x1="455" y1="180" x2="645" y2="280"/>
  <circle class="dot2" cx="460" cy="185" r="5"/><circle class="dot2" cx="495" cy="205" r="5"/><circle class="dot2" cx="530" cy="220" r="5"/><circle class="dot2" cx="565" cy="240" r="5"/><circle class="dot2" cx="605" cy="265" r="5"/><circle class="dot2" cx="640" cy="278" r="5"/>
  <text class="small" x="480" y="330">房龄 ↑，房价 ↓</text>

  <rect class="panel" x="760" y="100" width="300" height="250"/>
  <text class="label" x="785" y="130">关系弱：Cov ≈ 0</text>
  <line class="axis" x1="795" y1="300" x2="1025" y2="300"/><line class="axis" x1="795" y1="300" x2="795" y2="160"/>
  <circle class="dot3" cx="830" cy="240" r="5"/><circle class="dot3" cx="870" cy="275" r="5"/><circle class="dot3" cx="910" cy="205" r="5"/><circle class="dot3" cx="950" cy="260" r="5"/><circle class="dot3" cx="990" cy="220" r="5"/><circle class="dot3" cx="1010" cy="285" r="5"/><circle class="dot3" cx="875" cy="185" r="5"/>
  <text class="small" x="850" y="330">门牌号 vs 房价</text>

  <text class="formula" x="78" y="392">Cov(X,Y)=E[(X-μx)(Y-μy)]　　 Corr(X,Y)=Cov(X,Y)/(σxσy)</text>
</svg>
