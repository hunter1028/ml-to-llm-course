<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg{fill:#fbfcff} .card{fill:#ffffff;stroke:#d8dee9;stroke-width:1.4;rx:14}
      .axis{stroke:#5b6472;stroke-width:1.5} .grid{stroke:#e7ebf2;stroke-width:1}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:15px;fill:#4a5568} .title{font-size:24px;font-weight:700;fill:#111827}
      .blue{fill:#3b82f6} .red{fill:#ef4444} .green{fill:#10b981} .orange{fill:#f59e0b} .purple{fill:#8b5cf6}
      .line-blue{stroke:#3b82f6;stroke-width:3;fill:none} .line-red{stroke:#ef4444;stroke-width:3;fill:none}
      .line-green{stroke:#10b981;stroke-width:3;fill:none} .line-orange{stroke:#f59e0b;stroke-width:3;fill:none}
      .dash{stroke-dasharray:8 7} .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420"/>

  <text class="title" x="36" y="42">训练闭环：前向算预测，反向算梯度，优化器更新参数</text>
  <rect class="card" x="45" y="78" width="830" height="285"/>
  <rect x="80" y="150" width="95" height="58" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text class="txt" x="119" y="185">X</text>
  <path class="axis arrow" d="M180 179 L260 179"/>
  <rect x="260" y="150" width="120" height="58" rx="12" fill="#ecfdf5" stroke="#10b981"/><text class="small" x="285" y="174">神经网络</text><text class="small" x="295" y="195">参数 θ</text>
  <path class="axis arrow" d="M385 179 L465 179"/>
  <rect x="465" y="150" width="100" height="58" rx="12" fill="#fff7ed" stroke="#f59e0b"/><text class="txt" x="498" y="185">ŷ</text>
  <path class="axis arrow" d="M570 179 L650 179"/>
  <rect x="650" y="150" width="120" height="58" rx="12" fill="#fef2f2" stroke="#ef4444"/><text class="small" x="685" y="174">Loss</text><text class="small" x="680" y="195">和 y 比较</text>
  <path class="line-red arrow" d="M710 215 C700 292,510 315,330 238"/>
  <text class="small" x="485" y="310">反向传播：∂L/∂θ</text>
  <path class="line-orange arrow" d="M330 238 C270 290,220 270,195 215"/>
  <text class="small" x="110" y="280">更新：θ ← θ - η∇L</text>
  <text class="small" x="110" y="112">Forward</text><text class="small" x="620" y="112">Backward</text>

</svg>