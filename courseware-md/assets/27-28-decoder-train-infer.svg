260" width="90" height="72" rx="18" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1060" y="288" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="700"><tspan x="1060" dy="0">+</tspan><tspan x="1060" dy="20">token</tspan><tspan x="1060" dy="20">3</tspan></text><text x="230" y="530" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">一张 Causal Mask 同时算多个位置</text><text x="875" y="530" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">每一步依赖刚生成的结果</text></svg>