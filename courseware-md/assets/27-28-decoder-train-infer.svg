<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Decoder：训练并行，推理串行</title><desc id="desc">完整目标已知时可并行计算；生成时未来 token 尚不存在</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">Decoder：训练并行，推理串行</text><text x="230" y="125" text-anchor="middle" fill="#2563eb" font-family="Arial,'Noto Sans SC',sans-serif" font-size="27" font-weight="700">训练</text><text x="875" y="125" text-anchor="middle" fill="#9333ea" font-family="Arial,'Noto Sans SC',sans-serif" font-size="27" font-weight="700">推理</text><rect x="55" y="170" width="350" height="70" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="230" y="198" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" font-weight="500">BOS</text><line x1="405" y1="205" x2="500" y2="205" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><text x="545" y="212" text-anchor="middle" fill="#2563eb" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="700">我</text><rect x="55" y="275" width="350" height="70" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="230" y="303" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" font-weight="500">BOS 我</text><line x1="405" y1="310" x2="500" y2="310" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><text x="545" y="317" text-anchor="middle"