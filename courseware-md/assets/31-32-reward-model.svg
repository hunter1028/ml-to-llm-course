<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">奖励模型如何学习偏好排序</title><desc id="desc">同一 Prompt 下，让 chosen 的标量奖励高于 rejected</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">奖励模型如何学习偏好排序</text><rect x="50" y="230" width="190" height="95" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="145" y="267" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="23" font-weight="700"><tspan x="145" dy="0">Prompt x</tspan></text><rect x="330" y="145" width="250" height="90" rx="18" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="455" y="180" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700"><tspan x="455" dy="0">chosen 回答 yw</tspan></text><rect x="330" y="350" width="250" height="90" rx="18" fill="#fee2e2" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="455" y="385" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700"><tspan x="455" dy="0">rejected 回答 yl</tspan></text><line x1="240" y1="277" x2="330" y2="190" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="240" y1="277" x2="330" y2="395" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="690" y="205" width="220" height="165" rx="18" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="800" y="245" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="700"><tspan x="800" dy="0">Reward Model</tspan><tspan x="800" dy="31">r(x, y)</tspan><tspan x="800" dy="31">输出一个标量</tspan></text><line x1="580" y1="190" x2="690" y2="250" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="580" y1="395" x2="690" y2="325" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><rect x="990" y="230" width="165" height="95" rx="18" fill="#ffedd5" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1072" y="265" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" font-weight="700"><tspan x="1072" dy="0">目标</tspan><tspan x="1072" dy="31">r(yw) &gt; r(yl)</tspan></text><line x1="910" y1="287" x2="990" y2="277" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><text x="600" y="525" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="500">RM 学习的是标注规范中的偏好，不是自动判定真理。</text></svg>