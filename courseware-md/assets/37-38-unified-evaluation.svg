<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">双方案统一评测框架</title><desc id="desc">展示业务召回、F1、延迟、成本、格式稳定和审计六个评价维度。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">统一评测：模型分数只是一个维度</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">上线选择要同时满足质量、速度、成本、稳定性和可治理性</text><rect x="50" y="145" width="350" height="150" rx="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/><circle cx="88" cy="187" r="16" fill="#DC2626" stroke="#DC2626" stroke-width="2"/><text x="120" y="193" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#DC2626" text-anchor="start">业务召回</text><text x="78" y="233" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#526176" text-anchor="start">漏掉高风险工单会造成损失</text><path d="M 78 257 L 370 257" stroke="#CBD5E1" stroke-width="8" fill="none"/><path d="M 78 257 L 328 257" stroke="#DC2626" stroke-width="8" fill="none"/><rect x="435" y="145" width="350" height="150" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><circle cx="473" cy="187" r="16" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="505" y="193" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#2563EB" text-anchor="start">综合 F1</text><text x="463" y="233" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#526176" text-anchor="start">平衡误报与漏报</text><path d="M 463 257 L 755 257" stroke="#CBD5E1" stroke-width="8" fill="none"/><path d="M 463 257 L 683 257" stroke="#2563EB" stroke-width="8" fill="none"/><rect x="820" y="145" width="350" height="150" rx="16" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><circle cx="858" cy="187" r="16" fill="#D97706" stroke="#D97706" stroke-width="2"/><text x="890" y="193" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#D97706" text-anchor="start">P95 延迟</text><text x="848" y="233" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#526176" text-anchor="start">关注慢请求，不只看平均值</text><path d="M 848 257 L 1140 257" stroke="#CBD5E1" stroke-width="8" fill="none"/><path d="M 848 257 L 1028 257" stroke="#D97706" stroke-width="8" fill="none"/><rect x="50" y="335" width="350" height="150" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="2"/><circle cx="88" cy="377" r="16" fill="#059669" stroke="#059669" stroke-width="2"/><text x="120" y="383" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#059669" text-anchor="start">单位成本</text><text x="78" y="423" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#526176" text-anchor="start">折算每千次请求成本</text><path d="M 78 447 L 370 447" stroke="#CBD5E1" stroke-width="8" fill="none"/><path d="M 78 447 L 343 447" stroke="#059669" stroke-width="8" fill="none"/><rect x="435" y="335" width="350" height="150" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><circle cx="473" cy="377" r="16" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="505" y="383" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#7C3AED" text-anchor="start">格式稳定</text><text x="463" y="423" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#526176" text-anchor="start">JSON 与字段约束通过率</text><path d="M 463 447 L 755 447" stroke="#CBD5E1" stroke-width="8" fill="none"/><path d="M 463 447 L 698 447" stroke="#7C3AED" stroke-width="8" fill="none"/><rect x="820" y="335" width="350" height="150" rx="16" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/><circle cx="858" cy="377" r="16" fill="#0891B2" stroke="#0891B2" stroke-width="2"/><text x="890" y="383" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#0891B2" text-anchor="start">可解释/审计</text><text x="848" y="423" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#526176" text-anchor="start">能追踪输入、版本和依据</text><path d="M 848 447 L 1140 447" stroke="#CBD5E1" stroke-width="8" fill="none"/><path d="M 848 447 L 1048 447" stroke="#0891B2" stroke-width="8" fill="none"/><text x="600" y="560" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#172033" text-anchor="middle">先设置业务门槛，再在满足门槛的方案中比较成本，而不是先追最高离线分数</text></svg>