<text x="60" y="66" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#0f172a">神经网络最小直觉：一层一层提取组合特征</text>
<text x="60" y="100" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569">8×8 图像 → 64 个像素值 → 两个隐藏层 → 10 个类别分数</text>
