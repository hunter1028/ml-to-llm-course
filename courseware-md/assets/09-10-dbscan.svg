<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg{fill:#fbfcff} .card{fill:#ffffff;stroke:#d8dee9;stroke-width:1.4;rx:14}
      .axis{stroke:#5b6472;stroke-width:1.5} .grid{stroke:#e7ebf2;stroke-width:1}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:15px;fill:#4a5568} .title{font-size:24px;font-weight:700;fill:#111827}
      .blue{fill:#3b82f6} .red{fill:#ef4444} .green{fill:#10b981} .orange{fill:#f59e0b} .purple{fill:#8b5cf6}
      .line-blue{stroke:#3b82f6;stroke-width:3;fill:none} .line-red{stroke:#ef4444;stroke-width:3;fill:none}
      .line-green{stroke:#10b981;stroke-width:3;fill:none} .line-orange{stroke:#f59e0b;stroke-width:3;fill:none}
      .dash{stroke-dasharray:8 7} .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420"/>

  <text class="title" x="36" y="42">DBSCAN：密度足够才成簇，孤立点是噪声</text>
  <rect class="card" x="45" y="75" width="820" height="285"/>
  <circle cx="210" cy="205" r="86" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="555" cy="200" r="86" fill="#dcfce7" stroke="#10b981" stroke-width="2" stroke-dasharray="8 6"/>
  <circle class="blue" cx="190" cy="190" r="8"/><circle class="blue" cx="220" cy="180" r="8"/><circle class="blue" cx="245" cy="210" r="8"/><circle class="blue" cx="180" cy="235" r="8"/><circle class="blue" cx="225" cy="245" r="8"/>
  <circle class="green" cx="535" cy="180" r="8"/><circle class="green" cx="570" cy="170" r="8"/><circle class="green" cx="600" cy="210" r="8"/><circle class="green" cx="520" cy="230" r="8"/><circle class="green" cx="565" cy="245" r="8"/>
  <circle class="orange" cx="303" cy="210" r="7"/><text class="small" x="286" y="252">边界点</text>
  <circle class="red" cx="760" cy="130" r="7"/><circle class="red" cx="700" cy="300" r="7"/><text class="small" x="725" y="115">噪声点</text>
  <text class="small" x="140" y="108">ε 邻域</text><text class="small" x="470" y="108">MinPts 达标</text>
  <text class="small" x="105" y="336">核心点：邻域内点数足够</text><text class="small" x="430" y="336">无需提前指定簇数 K，可发现不规则形状</text>

</svg>