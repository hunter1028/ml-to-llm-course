<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">传统模型与大模型融合</title><desc id="desc">根据规则和置信度把请求路由到传统模型快路径或 RAG 加大模型复杂路径。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">传统模型 + 大模型融合架构</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">高频确定性决策走快路径，复杂样本再升级到大模型</text><rect x="50" y="225" width="170" height="110" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="135" y="267" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#2563EB" text-anchor="middle"><tspan x="135" dy="0">业务请求</tspan><tspan x="135" dy="27">结构化 + 文本</tspan></text><path d="M 220 280 L 330 280" stroke="#CBD5E1" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="400" cy="280" r="62" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/><text x="400" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#D97706" text-anchor="middle"><tspan x="400" dy="0">路由器</tspan><tspan x="400" dy="24">置信度/规则</tspan></text><path d="M 462 255 C 560 190, 600 180, 675 180" stroke="#059669" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="510" y="145" width="130" height="40" rx="20" fill="#059669" stroke="#059669" stroke-width="2"/><text x="575.0" y="172" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">快路径</text><rect x="675" y="125" width="220" height="110" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="785" y="168" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#059669" text-anchor="middle"><tspan x="785" dy="0">传统模型</tspan><tspan x="785" dy="27">毫秒级决策</tspan></text><path d="M 462 305 C 560 375, 600 390, 675 390" stroke="#7C3AED" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="510" y="395" width="130" height="40" rx="20" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="575.0" y="422" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">复杂路径</text><rect x="675" y="335" width="220" height="110" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="785" y="377" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#7C3AED" text-anchor="middle"><tspan x="785" dy="0">RAG + LLM</tspan><tspan x="785" dy="27">解释与建议</tspan></text><path d="M 895 180 L 1010 270" stroke="#CBD5E1" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 895 390 L 1010 300" stroke="#CBD5E1" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1010" y="235" width="150" height="100" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="1085" y="272" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#2563EB" text-anchor="middle"><tspan x="1085" dy="0">统一结果</tspan><tspan x="1085" dy="27">校验输出</tspan></text><text x="600" y="540" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">目标：让昂贵能力只处理真正需要它的样本，同时保留一致的业务接口</text></svg>