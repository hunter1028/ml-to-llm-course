<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg{fill:#fbfcff} .card{fill:#ffffff;stroke:#d8dee9;stroke-width:1.4;rx:14}
      .axis{stroke:#5b6472;stroke-width:1.5} .grid{stroke:#e7ebf2;stroke-width:1}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:15px;fill:#4a5568} .title{font-size:24px;font-weight:700;fill:#111827}
      .blue{fill:#3b82f6} .red{fill:#ef4444} .green{fill:#10b981} .orange{fill:#f59e0b} .purple{fill:#8b5cf6}
      .line-blue{stroke:#3b82f6;stroke-width:3;fill:none} .line-red{stroke:#ef4444;stroke-width:3;fill:none}
      .line-green{stroke:#10b981;stroke-width:3;fill:none} .line-orange{stroke:#f59e0b;stroke-width:3;fill:none}
      .dash{stroke-dasharray:8 7} .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420"/>

  <text class="title" x="36" y="42">K-Means：分配样本 → 更新中心 → 反复收敛</text>
  <rect class="card" x="40" y="70" width="840" height="300"/>
  <line class="axis" x1="95" y1="320" x2="820" y2="320"/>
  <line class="axis" x1="95" y1="320" x2="95" y2="105"/>
  <text class="small" x="815" y="344">特征1</text><text class="small" x="46" y="112">特征2</text>
  <circle class="blue" cx="190" cy="245" r="8"/><circle class="blue" cx="230" cy="220" r="8"/><circle class="blue" cx="175" cy="205" r="8"/><circle class="blue" cx="260" cy="255" r="8"/>
  <circle class="green" cx="520" cy="175" r="8"/><circle class="green" cx="565" cy="145" r="8"/><circle class="green" cx="610" cy="195" r="8"/><circle class="green" cx="540" cy="220" r="8"/>
  <circle class="red" cx="720" cy="270" r="8"/><circle class="red" cx="765" cy="240" r="8"/><circle class="red" cx="700" cy="220" r="8"/><circle class="red" cx="790" cy="285" r="8"/>
  <path class="line-orange dash arrow" d="M310 120 C250 160,235 185,220 228"/>
  <path class="line-orange dash arrow" d="M435 105 C480 125,520 145,560 185"/>
  <path class="line-orange dash arrow" d="M655 120 C690 170,720 215,744 253"/>
  <text class="small" x="282" y="112">初始中心</text><circle class="orange" cx="310" cy="120" r="12"/><text class="txt" x="306" y="126">×</text>
  <circle class="orange" cx="220" cy="228" r="12"/><text class="txt" x="216" y="234">×</text><text class="small" x="155" y="290">簇1</text>
  <circle class="orange" cx="560" cy="185" r="12"/><text class="txt" x="556" y="191">×</text><text class="small" x="520" y="260">簇2</text>
  <circle class="orange" cx="744" cy="253" r="12"/><text class="txt" x="740" y="259">×</text><text class="small" x="710" y="326">簇3</text>
  <text class="small" x="120" y="360">目标：让样本到所属中心的平方距离之和最小</text>

</svg>