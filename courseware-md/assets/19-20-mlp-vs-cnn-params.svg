<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">

  <defs>
    <style>
      .bg{fill:#fbfcff}.card{fill:#fff;stroke:#d8dee9;stroke-width:1.4}.soft{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:14px;fill:#4a5568}.title{font-size:24px;font-weight:700;fill:#111827}.mini{font-size:12px;fill:#64748b}
      .blue{fill:#3b82f6}.red{fill:#ef4444}.green{fill:#10b981}.orange{fill:#f59e0b}.purple{fill:#8b5cf6}.gray{fill:#64748b}
      .line{stroke:#475569;stroke-width:2;fill:none}.dash{stroke-dasharray:7 6}.arrow{marker-end:url(#arrow)}
      .blueLine{stroke:#3b82f6;stroke-width:3;fill:none}.redLine{stroke:#ef4444;stroke-width:3;fill:none}.greenLine{stroke:#10b981;stroke-width:3;fill:none}.orangeLine{stroke:#f59e0b;stroke-width:3;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>

  <rect class="bg" width="920" height="420"/>
  <text class="title" x="36" y="42">MLP 与 CNN 的参数量差异</text>
  <rect class="card" x="55" y="82" width="375" height="265" rx="16"/>
  <text class="txt" x="90" y="122">图片拉平进 MLP</text>
  <rect class="soft" x="90" y="155" width="110" height="80" rx="12"/><text class="small" x="112" y="188">224×224×3</text><text class="small" x="122" y="213">=150528</text>
  <path class="line arrow" d="M210 195 L285 195"/>
  <rect x="295" y="155" width="85" height="80" rx="12" fill="#fee2e2" stroke="#ef4444"/><text class="small" x="316" y="188">1000</text><text class="small" x="310" y="213">隐藏元</text>
  <text class="small" x="88" y="285">参数≈150528×1000+1000</text>
  <text class="txt" x="88" y="318" fill="#ef4444">约 1.5 亿</text>
  <rect class="card" x="490" y="82" width="375" height="265" rx="16"/>
  <text class="txt" x="525" y="122">3×3 卷积核共享</text>
  <rect class="soft" x="525" y="155" width="110" height="80" rx="12"/><text class="small" x="547" y="188">3 通道</text><text class="small" x="547" y="213">局部窗口</text>
  <path class="line arrow" d="M645 195 L720 195"/>
  <rect x="730" y="155" width="85" height="80" rx="12" fill="#dcfce7" stroke="#10b981"/><text class="small" x="753" y="188">32</text><text class="small" x="745" y="213">卷积核</text>
  <text class="small" x="523" y="285">参数=3×3×3×32+32</text>
  <text class="txt" x="523" y="318" fill="#10b981">896 个</text>
</svg>
