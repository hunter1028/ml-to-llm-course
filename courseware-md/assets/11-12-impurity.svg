<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg{fill:#fbfcff} .card{fill:#ffffff;stroke:#d8dee9;stroke-width:1.4;rx:14}
      .axis{stroke:#5b6472;stroke-width:1.5} .grid{stroke:#e7ebf2;stroke-width:1}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:15px;fill:#4a5568} .title{font-size:24px;font-weight:700;fill:#111827}
      .blue{fill:#3b82f6} .red{fill:#ef4444} .green{fill:#10b981} .orange{fill:#f59e0b} .purple{fill:#8b5cf6}
      .line-blue{stroke:#3b82f6;stroke-width:3;fill:none} .line-red{stroke:#ef4444;stroke-width:3;fill:none}
      .line-green{stroke:#10b981;stroke-width:3;fill:none} .line-orange{stroke:#f59e0b;stroke-width:3;fill:none}
      .dash{stroke-dasharray:8 7} .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420"/>

  <text class="title" x="36" y="42">不纯度：节点越混，Gini / Entropy 越高</text>
  <rect class="card" x="50" y="76" width="820" height="290"/>
  <rect x="100" y="112" width="190" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle class="blue" cx="145" cy="155" r="10"/><circle class="blue" cx="190" cy="155" r="10"/><circle class="blue" cx="235" cy="155" r="10"/>
  <circle class="blue" cx="145" cy="205" r="10"/><circle class="blue" cx="190" cy="205" r="10"/><circle class="blue" cx="235" cy="205" r="10"/>
  <circle class="red" cx="145" cy="255" r="10"/><circle class="red" cx="190" cy="255" r="10"/><circle class="red" cx="235" cy="255" r="10"/>
  <text class="small" x="122" y="330">混合节点：不纯度高</text>
  <path class="line-orange arrow" d="M320 205 L430 205"/><text class="small" x="337" y="185">切分</text>
  <rect x="465" y="105" width="145" height="100" rx="14" fill="#eff6ff" stroke="#3b82f6"/>
  <circle class="blue" cx="500" cy="138" r="9"/><circle class="blue" cx="535" cy="138" r="9"/><circle class="blue" cx="570" cy="138" r="9"/><circle class="blue" cx="517" cy="172" r="9"/><circle class="blue" cx="552" cy="172" r="9"/>
  <rect x="655" y="105" width="145" height="100" rx="14" fill="#fef2f2" stroke="#ef4444"/>
  <circle class="red" cx="695" cy="138" r="9"/><circle class="red" cx="730" cy="138" r="9"/><circle class="red" cx="765" cy="138" r="9"/><circle class="red" cx="713" cy="172" r="9"/>
  <text class="small" x="470" y="240">左子节点更纯</text><text class="small" x="655" y="240">右子节点更纯</text>
  <text class="small" x="485" y="310">好的切分 = 切分前后不纯度下降明显</text>

</svg>