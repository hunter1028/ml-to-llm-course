<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg{fill:#fbfcff} .card{fill:#ffffff;stroke:#d8dee9;stroke-width:1.4;rx:14}
      .axis{stroke:#5b6472;stroke-width:1.5} .grid{stroke:#e7ebf2;stroke-width:1}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:15px;fill:#4a5568} .title{font-size:24px;font-weight:700;fill:#111827}
      .blue{fill:#3b82f6} .red{fill:#ef4444} .green{fill:#10b981} .orange{fill:#f59e0b} .purple{fill:#8b5cf6}
      .line-blue{stroke:#3b82f6;stroke-width:3;fill:none} .line-red{stroke:#ef4444;stroke-width:3;fill:none}
      .line-green{stroke:#10b981;stroke-width:3;fill:none} .line-orange{stroke:#f59e0b;stroke-width:3;fill:none}
      .dash{stroke-dasharray:8 7} .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420"/>

  <text class="title" x="36" y="42">RNN：同一个单元沿时间展开，隐藏状态传递历史信息</text>
  <rect class="card" x="45" y="75" width="830" height="295"/>
  <g transform="translate(100 145)">
    <rect x="0" y="0" width="105" height="75" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text class="txt" x="34" y="44">RNN</text><text class="small" x="38" y="105">x₁</text>
  </g>
  <g transform="translate(310 145)">
    <rect x="0" y="0" width="105" height="75" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text class="txt" x="34" y="44">RNN</text><text class="small" x="38" y="105">x₂</text>
  </g>
  <g transform="translate(520 145)">
    <rect x="0" y="0" width="105" height="75" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text class="txt" x="34" y="44">RNN</text><text class="small" x="38" y="105">x₃</text>
  </g>
  <g transform="translate(730 145)">
    <rect x="0" y="0" width="105" height="75" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text class="txt" x="34" y="44">RNN</text><text class="small" x="38" y="105">x₄</text>
  </g>
  <path class="axis arrow" d="M205 182 L310 182"/><text class="small" x="238" y="165">h₁</text>
  <path class="axis arrow" d="M415 182 L520 182"/><text class="small" x="448" y="165">h₂</text>
  <path class="axis arrow" d="M625 182 L730 182"/><text class="small" x="658" y="165">h₃</text>
  <path class="axis arrow" d="M152 140 L152 105"/><text class="small" x="135" y="98">y₁</text>
  <path class="axis arrow" d="M362 140 L362 105"/><text class="small" x="345" y="98">y₂</text>
  <path class="axis arrow" d="M572 140 L572 105"/><text class="small" x="555" y="98">y₃</text>
  <path class="axis arrow" d="M782 140 L782 105"/><text class="small" x="765" y="98">y₄</text>
  <text class="small" x="120" y="330">优点：适合序列；缺点：时间步串行，长距离信息容易衰减</text>

</svg>