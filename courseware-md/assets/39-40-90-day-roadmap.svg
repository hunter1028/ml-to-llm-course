<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">90 天学习与求职路线</title><desc id="desc">将后续学习分为补基础、做深项目和面向求职三个 30 天阶段。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">90 天能力巩固路线</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">每个阶段都要留下可检查的产出，避免只看课程不做作品</text><rect x="55" y="155" width="330" height="335" rx="20" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><rect x="110" y="180" width="220" height="40" rx="20" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="220.0" y="207" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 1-30 天</text><text x="220" y="275" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#2563EB" text-anchor="middle">补齐基础</text><circle cx="117" cy="330" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="143" y="337" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="start">复写核心算法</text><circle cx="117" cy="385" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="143" y="392" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="start">整理知识地图</text><circle cx="117" cy="440" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="143" y="447" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="start">完成小型基线</text><path d="M 385 325 L 435 325" stroke="#CBD5E1" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="435" y="155" width="330" height="335" rx="20" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/><rect x="490" y="180" width="220" height="40" rx="20" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="600.0" y="207" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 31-60 天</text><text x="600" y="275" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#7C3AED" text-anchor="middle">做深项目</text><circle cx="497" cy="330" r="8" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="523" y="337" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="start">统一评测</text><circle cx="497" cy="385" r="8" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="523" y="392" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="start">误差分析</text><circle cx="497" cy="440" r="8" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="523" y="447" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="start">加入部署与监控</text><path d="M 765 325 L 815 325" stroke="#CBD5E1" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="815" y="155" width="330" height="335" rx="20" fill="#FFFFFF" stroke="#059669" stroke-width="3"/><rect x="870" y="180" width="220" height="40" rx="20" fill="#059669" stroke="#059669" stroke-width="2"/><text x="980.0" y="207" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 61-90 天</text><text x="980" y="275" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#059669" text-anchor="middle">面向求职</text><circle cx="877" cy="330" r="8" fill="#059669" stroke="#059669" stroke-width="2"/><text x="903" y="337" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="start">项目文档</text><circle cx="877" cy="385" r="8" fill="#059669" stroke="#059669" stroke-width="2"/><text x="903" y="392" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="start">简历表达</text><circle cx="877" cy="440" r="8" fill="#059669" stroke="#059669" stroke-width="2"/><text x="903" y="447" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="start">模拟面试与复盘</text><text x="600" y="555" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#172033" text-anchor="middle">每周至少形成一个可展示产出：代码、实验表、架构图、报告或复盘文章</text></svg>