<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">三类 Transformer 架构</title><desc id="desc">Encoder 读懂，Decoder 续写，Encoder-Decoder 条件生成</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">三类 Transformer 架构</text><rect x="45" y="120" width="350" height="390" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="220" y="170" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="28" font-weight="700">Encoder-only</text><rect x="90" y="215" width="260" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="220" y="252" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">双向 Self-Attention</text><rect x="90" y="300" width="260" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="220" y="337" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">输出上下文表示</text><rect x="90" y="385" width="260" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="220" y="422" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">分类・抽取・检索</text><rect x="425" y="120" width="350" height="390" rx="18" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="170" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="28" font-weight="700">Decoder-only</text><rect x="470" y="215" width="260" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="252" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">因果 Self-Attention</text><rect x="470" y="300" width="260" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="337" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">逐 token 生成</text><rect x="470" y="385" width="260" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="422" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">对话・续写・代码</text><rect x="805" y="120" width="350" height="390" rx="18" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="980" y="170" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="28" font-weight="700">Encoder-Decoder</text><rect x="850" y="215" width="260" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="980" y="252" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">Encoder 读取输入</text><rect x="850" y="300" width="260" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="980" y="337" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">Cross-Attention 连接</text><rect x="850" y="385" width="260" height="58" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="980" y="422" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">翻译・摘要・转换</text><text x="600" y="570" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="500">架构选择首先看输出形式和信息流，不是只看参数量。</text></svg>