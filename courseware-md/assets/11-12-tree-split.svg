<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg{fill:#fbfcff} .card{fill:#ffffff;stroke:#d8dee9;stroke-width:1.4;rx:14}
      .axis{stroke:#5b6472;stroke-width:1.5} .grid{stroke:#e7ebf2;stroke-width:1}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:15px;fill:#4a5568} .title{font-size:24px;font-weight:700;fill:#111827}
      .blue{fill:#3b82f6} .red{fill:#ef4444} .green{fill:#10b981} .orange{fill:#f59e0b} .purple{fill:#8b5cf6}
      .line-blue{stroke:#3b82f6;stroke-width:3;fill:none} .line-red{stroke:#ef4444;stroke-width:3;fill:none}
      .line-green{stroke:#10b981;stroke-width:3;fill:none} .line-orange{stroke:#f59e0b;stroke-width:3;fill:none}
      .dash{stroke-dasharray:8 7} .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420"/>

  <text class="title" x="36" y="42">决策树：用一连串“是否满足条件”切分样本</text>
  <rect class="card" x="55" y="78" width="810" height="295"/>
  <rect x="365" y="100" width="190" height="50" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text class="txt" x="393" y="132">收入 ≥ 8000?</text>
  <line class="axis arrow" x1="420" y1="150" x2="275" y2="215"/><line class="axis arrow" x1="500" y1="150" x2="645" y2="215"/>
  <text class="small" x="310" y="185">否</text><text class="small" x="588" y="185">是</text>
  <rect x="180" y="215" width="190" height="50" rx="10" fill="#fff7ed" stroke="#f59e0b"/><text class="txt" x="211" y="247">逾期次数 ≥ 2?</text>
  <rect x="550" y="215" width="190" height="50" rx="10" fill="#ecfdf5" stroke="#10b981"/><text class="txt" x="588" y="247">负债率 ≥ 60%?</text>
  <line class="axis arrow" x1="230" y1="265" x2="155" y2="325"/><line class="axis arrow" x1="320" y1="265" x2="395" y2="325"/>
  <line class="axis arrow" x1="600" y1="265" x2="535" y2="325"/><line class="axis arrow" x1="690" y1="265" x2="755" y2="325"/>
  <rect x="95" y="325" width="120" height="36" rx="8" fill="#fee2e2"/><text class="small" x="122" y="348">高风险</text>
  <rect x="340" y="325" width="120" height="36" rx="8" fill="#dcfce7"/><text class="small" x="367" y="348">低风险</text>
  <rect x="475" y="325" width="120" height="36" rx="8" fill="#fef3c7"/><text class="small" x="500" y="348">中风险</text>
  <rect x="700" y="325" width="120" height="36" rx="8" fill="#fee2e2"/><text class="small" x="727" y="348">高风险</text>

</svg>