<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">从预训练到对齐模型</title><desc id="desc">知识与语言规律、指令示范、人类偏好依次塑造模型行为</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">从预训练到对齐模型</text><rect x="40" y="220" width="200" height="125" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="140" y="265" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" font-weight="700">预训练模型</text><text x="140" y="307" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="500">预测 token</text><rect x="270" y="220" width="200" height="125" rx="18" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="370" y="265" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" font-weight="700">SFT</text><text x="370" y="307" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="500">模仿高质量回答</text><rect x="500" y="220" width="200" height="125" rx="18" fill="#ffedd5" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="265" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" font-weight="700">偏好数据</text><text x="600" y="307" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="500">chosen / rejected</text><rect x="730" y="220" width="200" height="125" rx="18" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="830" y="265" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" font-weight="700">RM 或 DPO</text><text x="830" y="307" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="500">学习偏好方向</text><rect x="960" y="220" width="200" height="125" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1060" y="265" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" font-weight="700">对齐模型</text><text x="1060" y="307" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="500">评测与上线</text><line x1="240" y1="282" x2="270" y2="282" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="470" y1="282" x2="500" y2="282" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="700" y1="282" x2="730" y2="282" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="930" y1="282" x2="960" y2="282" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><text x="600" y="455" text-anchor="middle" fill="#dc2626" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="700">对齐主要改变“怎样回答”，不自动获得实时、可核验的事实。</text></svg>