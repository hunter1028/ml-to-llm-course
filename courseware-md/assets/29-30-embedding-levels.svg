<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">三种容易混淆的向量</title><desc id="desc">静态 token 向量经过上下文计算，再按任务形成句向量</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">三种容易混淆的向量</text><rect x="70" y="175" width="300" height="250" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="220" y="225" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700">Token Embedding</text><text x="220" y="290" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500"><tspan x="220" dy="0">查表得到</tspan><tspan x="220" dy="31">“苹果”初始向量</tspan></text><rect x="450" y="175" width="300" height="250" rx="18" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="225" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700">上下文化表示</text><text x="600" y="290" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500"><tspan x="600" dy="0">经过 Transformer</tspan><tspan x="600" dy="31">吃苹果 ≠ 苹果公司</tspan></text><rect x="830" y="175" width="300" height="250" rx="18" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="980" y="225" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700">Sentence Embedding</text><text x="980" y="290" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500"><tspan x="980" dy="0">Pooling / 专门训练</tspan><tspan x="980" dy="31">用于检索与聚类</tspan></text><line x1="370" y1="300" x2="450" y2="300" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="750" y1="300" x2="830" y2="300" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><text x="600" y="520" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="500">相似度表达模型空间中的接近程度，不自动验证事实真假。</text></svg>