<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">LoRA 微调工作流</title><desc id="desc">从任务定义、数据制作、LoRA 配置、训练、评测到部署回归的闭环。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">LoRA 微调闭环</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">先把任务和评测定义清楚，再训练；训练完成不等于业务有效</text><circle cx="120" cy="175" r="30" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="120" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><rect x="35" y="225" width="170" height="170" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="120" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#2563EB" text-anchor="middle">定义任务</text><text x="120" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#526176" text-anchor="middle"><tspan x="120" dy="0">输入</tspan><tspan x="120" dy="25">输出</tspan><tspan x="120" dy="25">边界</tspan></text><path d="M 205 310 L 228 310" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="313" cy="175" r="30" fill="#0891B2" stroke="#0891B2" stroke-width="2"/><text x="313" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><rect x="228" y="225" width="170" height="170" rx="16" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/><text x="313" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#0891B2" text-anchor="middle">制作数据</text><text x="313" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#526176" text-anchor="middle"><tspan x="313" dy="0">清洗</tspan><tspan x="313" dy="25">模板</tspan><tspan x="313" dy="25">切分</tspan></text><path d="M 398 310 L 421 310" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="506" cy="175" r="30" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="506" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><rect x="421" y="225" width="170" height="170" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="506" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#7C3AED" text-anchor="middle">配置 LoRA</text><text x="506" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#526176" text-anchor="middle"><tspan x="506" dy="0">目标层</tspan><tspan x="506" dy="25">r</tspan><tspan x="506" dy="25">α</tspan></text><path d="M 591 310 L 614 310" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="699" cy="175" r="30" fill="#D97706" stroke="#D97706" stroke-width="2"/><text x="699" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><rect x="614" y="225" width="170" height="170" rx="16" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="699" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#D97706" text-anchor="middle">训练监控</text><text x="699" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#526176" text-anchor="middle"><tspan x="699" dy="0">Loss</tspan><tspan x="699" dy="25">显存</tspan><tspan x="699" dy="25">过拟合</tspan></text><path d="M 784 310 L 807 310" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="892" cy="175" r="30" fill="#059669" stroke="#059669" stroke-width="2"/><text x="892" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><rect x="807" y="225" width="170" height="170" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="2"/><text x="892" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#059669" text-anchor="middle">离线评测</text><text x="892" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#526176" text-anchor="middle"><tspan x="892" dy="0">质量</tspan><tspan x="892" dy="25">格式</tspan><tspan x="892" dy="25">鲁棒性</tspan></text><path d="M 977 310 L 1000 310" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="1085" cy="175" r="30" fill="#DC2626" stroke="#DC2626" stroke-width="2"/><text x="1085" y="183" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text><rect x="1000" y="225" width="170" height="170" rx="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/><text x="1085" y="270" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#DC2626" text-anchor="middle">部署回归</text><text x="1085" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#526176" text-anchor="middle"><tspan x="1085" dy="0">延迟</tspan><tspan x="1085" dy="25">成本</tspan><tspan x="1085" dy="25">回滚</tspan></text><path d="M 1085 410 C 1085 545, 120 545, 120 420" stroke="#526176" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="9 8"/><text x="600" y="515" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#526176" text-anchor="middle">线上失败样本 → 回流标注 → 新一轮数据与训练</text></svg>