<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg{fill:#fbfcff} .card{fill:#ffffff;stroke:#d8dee9;stroke-width:1.4;rx:14}
      .axis{stroke:#5b6472;stroke-width:1.5} .grid{stroke:#e7ebf2;stroke-width:1}
      .txt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033;font-size:18px}
      .small{font-size:15px;fill:#4a5568} .title{font-size:24px;font-weight:700;fill:#111827}
      .blue{fill:#3b82f6} .red{fill:#ef4444} .green{fill:#10b981} .orange{fill:#f59e0b} .purple{fill:#8b5cf6}
      .line-blue{stroke:#3b82f6;stroke-width:3;fill:none} .line-red{stroke:#ef4444;stroke-width:3;fill:none}
      .line-green{stroke:#10b981;stroke-width:3;fill:none} .line-orange{stroke:#f59e0b;stroke-width:3;fill:none}
      .dash{stroke-dasharray:8 7} .arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420"/>

  <text class="title" x="36" y="42">卷积：小窗口滑动，提取局部模式</text>
  <rect class="card" x="45" y="75" width="830" height="295"/>
  <g transform="translate(90 120)">
    <text class="small" x="0" y="-20">输入图像 5×5</text>
    <rect x="0" y="0" width="200" height="200" fill="#fff" stroke="#cbd5e1"/>
    <g stroke="#cbd5e1"><path d="M40 0V200M80 0V200M120 0V200M160 0V200M0 40H200M0 80H200M0 120H200M0 160H200"/></g>
    <rect x="40" y="40" width="120" height="120" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  </g>
  <g transform="translate(360 150)">
    <text class="small" x="0" y="-20">卷积核 3×3</text>
    <rect x="0" y="0" width="120" height="120" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <g stroke="#f59e0b"><path d="M40 0V120M80 0V120M0 40H120M0 80H120"/></g>
  </g>
  <path class="axis arrow" d="M510 210 L600 210"/><text class="small" x="530" y="190">点乘求和</text>
  <g transform="translate(630 145)">
    <text class="small" x="0" y="-18">特征图</text>
    <rect x="0" y="0" width="150" height="150" fill="#ecfdf5" stroke="#10b981"/>
    <g stroke="#10b981"><path d="M50 0V150M100 0V150M0 50H150M0 100H150"/></g>
    <circle class="green" cx="75" cy="75" r="14"/>
  </g>
  <text class="small" x="95" y="350">同一个卷积核在不同位置共享参数：检测同一种局部模式</text>

</svg>