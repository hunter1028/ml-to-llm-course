<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300">
  <style>.bg{fill:#fbfcff}.title{font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif;fill:#172033}.txt{font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif;fill:#4b5870}.axis{stroke:#8b98ad;stroke-width:1.4}.bar1{fill:#2f6fed}.bar2{fill:#34a853}.bar3{fill:#ea4335}.lab{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif;fill:#263348}.formula{font:600 17px Menlo,Consolas,monospace;fill:#263348}.box{fill:#fff;stroke:#d7dfef;stroke-width:1.4;rx:12}</style>
  <rect class="bg" width="920" height="300"/>
  <text class="title" x="36" y="42">类别分布：一次多分类选择</text>
  <text class="txt" x="36" y="70">一次样本属于 K 个类别中的一个；softmax 输出的就是一组类别概率。</text>
  <line class="axis" x1="90" y1="230" x2="520" y2="230"/>
  <line class="axis" x1="90" y1="230" x2="90" y2="95"/>
  <rect class="bar1" x="160" y="120" width="62" height="110"/><rect class="bar2" x="275" y="185" width="62" height="45"/><rect class="bar3" x="390" y="205" width="62" height="25"/>
  <text class="lab" x="175" y="255">猫</text><text class="lab" x="290" y="255">狗</text><text class="lab" x="405" y="255">鸟</text>
  <text class="lab" x="164" y="110">0.7</text><text class="lab" x="279" y="175">0.2</text><text class="lab" x="394" y="195">0.1</text>
  <rect class="box" x="590" y="112" width="250" height="102"/>
  <text class="formula" x="612" y="145">[0.7, 0.2, 0.1]</text>
  <text class="txt" x="612" y="178">概率和必须等于 1</text>
  <text class="txt" x="612" y="204">最大值对应预测类别</text>
</svg>
