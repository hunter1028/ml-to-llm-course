<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">RNN、CNN 与自注意力的信息路径</title><desc id="desc">比较远距离 token 建立联系的路径</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/></filter></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="60" y="58" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="700">RNN、CNN 与自注意力的信息路径</text><text x="80" y="177" text-anchor="start" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="700">RNN：顺序传递</text><rect x="430" y="135" width="110" height="75" rx="16" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="485" y="181" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 1</text><rect x="580" y="135" width="110" height="75" rx="16" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="635" y="181" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 2</text><rect x="730" y="135" width="110" height="75" rx="16" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="785" y="181" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 3</text><rect x="880" y="135" width="110" height="75" rx="16" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="935" y="181" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 4</text><line x1="540" y1="172" x2="580" y2="172" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="690" y1="172" x2="730" y2="172" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="840" y1="172" x2="880" y2="172" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><text x="80" y="342" text-anchor="start" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="700">CNN：局部逐层汇合</text><rect x="430" y="300" width="110" height="75" rx="16" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="485" y="346" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 1</text><rect x="580" y="300" width="110" height="75" rx="16" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="635" y="346" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 2</text><rect x="730" y="300" width="110" height="75" rx="16" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="785" y="346" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 3</text><rect x="880" y="300" width="110" height="75" rx="16" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="935" y="346" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 4</text><line x1="540" y1="337" x2="580" y2="337" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="690" y1="337" x2="730" y2="337" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="840" y1="337" x2="880" y2="337" stroke="#94a3b8" stroke-width="3"  marker-end="url(#arrow)"/><line x1="485" y1="378" x2="785" y2="378" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="80" y="507" text-anchor="start" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="700">Self-Attention：直接连接</text><rect x="430" y="465" width="110" height="75" rx="16" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="485" y="511" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 1</text><rect x="580" y="465" width="110" height="75" rx="16" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="635" y="511" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 2</text><rect x="730" y="465" width="110" height="75" rx="16" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="785" y="511" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 3</text><rect x="880" y="465" width="110" height="75" rx="16" fill="#f3e8ff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="935" y="511" text-anchor="middle" fill="#172033" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="500">token 4</text><line x1="485" y1="480" x2="900" y2="480" stroke="#9333ea" stroke-width="3"  marker-end="url(#arrow)"/><line x1="635" y1="480" x2="900" y2="480" stroke="#9333ea" stroke-width="3"  marker-end="url(#arrow)"/><line x1="785" y1="480" x2="900" y2="480" stroke="#9333ea" stroke-width="3"  marker-end="url(#arrow)"/><text x="600" y="595" text-anchor="middle" fill="#526079" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="500">路径越短，远距离信息越容易直接交互；标准注意力的代价是 N×N 关系矩阵。</text></svg>