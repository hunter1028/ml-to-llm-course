<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">工业方案选型树</title><desc id="desc">根据固定预测、外部知识、行为适配和工具执行四类问题选择方案。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.22"/></filter></defs>
<rect width="1200" height="620" fill="#F8FAFC"/><text x="50" y="55" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">方案选型：先判断问题，再决定模型</text><text x="50" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#526176" text-anchor="start">传统模型、RAG、微调和 Agent 解决的是不同瓶颈</text><circle cx="150" cy="295" r="80" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="150" y="282" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#2563EB" text-anchor="middle"><tspan x="150" dy="0">业务问题</tspan><tspan x="150" dy="28">是什么？</tspan></text><path d="M 230 295 C 330 295, 315 170, 420 170" stroke="#526176" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="125" width="300" height="90" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="2"/><text x="440" y="159" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="start">固定标签/数值预测</text><text x="440" y="191" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#526176" text-anchor="start">稳定、便宜、易解释</text><path d="M 720 170 L 790 170" stroke="#059669" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="790" y="130" width="340" height="80" rx="16" fill="#059669" stroke="#059669" stroke-width="2"/><text x="960" y="179" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="800" fill="#FFFFFF" text-anchor="middle">传统 ML</text><path d="M 230 295 C 330 295, 315 290, 420 290" stroke="#526176" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="245" width="300" height="90" rx="16" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/><text x="440" y="279" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="start">缺少外部新知识</text><text x="440" y="311" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#526176" text-anchor="start">检索后再生成</text><path d="M 720 290 L 790 290" stroke="#0891B2" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="790" y="250" width="340" height="80" rx="16" fill="#0891B2" stroke="#0891B2" stroke-width="2"/><text x="960" y="299" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="800" fill="#FFFFFF" text-anchor="middle">RAG</text><path d="M 230 295 C 330 295, 315 410, 420 410" stroke="#526176" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="365" width="300" height="90" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="440" y="399" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="start">输出风格或行为不稳</text><text x="440" y="431" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#526176" text-anchor="start">用示例改变行为</text><path d="M 720 410 L 790 410" stroke="#7C3AED" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="790" y="370" width="340" height="80" rx="16" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="960" y="419" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="800" fill="#FFFFFF" text-anchor="middle">SFT / LoRA</text><path d="M 230 295 C 330 295, 315 530, 420 530" stroke="#526176" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="485" width="300" height="90" rx="16" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="440" y="519" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="start">需要多步调用工具</text><text x="440" y="551" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#526176" text-anchor="start">规划、执行、校验</text><path d="M 720 530 L 790 530" stroke="#D97706" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="790" y="490" width="340" height="80" rx="16" fill="#D97706" stroke="#D97706" stroke-width="2"/><text x="960" y="539" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="800" fill="#FFFFFF" text-anchor="middle">Agent</text><text x="600" y="590" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">组合方案很常见：传统模型做高频决策，RAG 提供事实，LLM 负责自然语言交互</text></svg>